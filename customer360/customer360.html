<meta charset="utf-8">
<title>Volta Customer 360</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700;800&family=Noto+Sans:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script>
(function(){ try{ var t=localStorage.getItem('voltaTheme'); if(t==='dark'||t==='light') document.documentElement.setAttribute('data-theme',t); }catch(e){} })();
</script>
<style>
  /* Layout: Volta navy band header with tabs, then either the customer ledger (Data) or a findings-first report (Analysis); a profile sheet slides over the ledger. */
  :root{
    --paper:#f4f4ef; --surface:#ffffff; --ink:#171724; --muted:#66667a; --line:#e0e0d9;
    --navy:#1a1a34; --navy-ink:#f2f2ee; --navy-sub:#c8c8d4; --lime:#a8d600; --lime-ink:#1a1a34;
    --good:#1f8a4c; --good-soft:#e4f4e9; --bad:#c9432f; --bad-soft:#fbe8e5; --warn:#b8790f; --warn-soft:#f8ecd8;
    --track:#e7e7e0; --hover:#f0f0e8; --scrim:rgba(23,23,36,.45); --grid:#e6e6df;
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
    --shadow:0 1px 2px rgba(23,23,36,.06), 0 8px 24px -12px rgba(23,23,36,.18);
    --f-body:"Noto Sans Georgian","Noto Sans",system-ui,sans-serif; --f-num:"IBM Plex Mono",ui-monospace,monospace;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --paper:#131320; --surface:#1b1b2c; --ink:#ededf2; --muted:#9a9aae; --line:#31314a;
    --navy:#0d0d1a; --navy-ink:#f2f2ee; --navy-sub:#a9a9bd; --lime:#c2ff00; --lime-ink:#12120c;
    --good:#4cc785; --good-soft:#173226; --bad:#ff7a63; --bad-soft:#3a1c17; --warn:#e3ac4b; --warn-soft:#392c14;
    --track:#282840; --hover:#232338; --scrim:rgba(0,0,0,.6); --grid:#2a2a40;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -14px rgba(0,0,0,.6); color-scheme:dark; } }
  :root[data-theme="dark"]{
    --paper:#131320; --surface:#1b1b2c; --ink:#ededf2; --muted:#9a9aae; --line:#31314a;
    --navy:#0d0d1a; --navy-ink:#f2f2ee; --navy-sub:#a9a9bd; --lime:#c2ff00; --lime-ink:#12120c;
    --good:#4cc785; --good-soft:#173226; --bad:#ff7a63; --bad-soft:#3a1c17; --warn:#e3ac4b; --warn-soft:#392c14;
    --track:#282840; --hover:#232338; --scrim:rgba(0,0,0,.6); --grid:#2a2a40;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 28px -14px rgba(0,0,0,.6); color-scheme:dark; }

  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
  .gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .wrap{max-width:1320px;margin:0 auto}
  td.n,.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

  header.top{background:var(--navy);color:var(--navy-ink);border-bottom:4px solid var(--lime);padding-block:20px 0}
  .toprow{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
  .eyebrow{font-family:var(--f-num);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--lime);font-weight:600;margin:0 0 8px}
  h1{font-size:clamp(24px,3.4vw,32px);line-height:1.15;margin:0 0 6px;font-weight:800;text-wrap:balance}
  .sub{margin:0;color:var(--navy-sub);font-size:14px;max-width:76ch}
  .stamp{margin-top:12px;font-family:var(--f-num);font-size:11.5px;color:var(--navy-sub);display:flex;gap:16px;flex-wrap:wrap}
  .stamp b{color:var(--navy-ink);font-weight:600}
  .toggles{display:flex;gap:8px;align-items:center;flex:none}
  .seg2{display:inline-flex;border:1px solid var(--navy-sub);border-radius:8px;overflow:hidden}
  .seg2 button{font:inherit;font-size:12.5px;font-weight:700;padding:6px 11px;background:transparent;color:var(--navy-sub);border:none;cursor:pointer}
  .seg2 button[aria-pressed="true"]{background:var(--lime);color:var(--lime-ink)}
  .iconbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--navy-sub);background:transparent;color:var(--navy-ink);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
  .iconbtn svg{width:17px;height:17px}
  nav.tabs{display:flex;gap:4px;margin-top:16px}
  nav.tabs button{font:inherit;font-size:14px;font-weight:700;color:var(--navy-sub);background:transparent;border:none;border-radius:8px 8px 0 0;padding:10px 16px;cursor:pointer}
  nav.tabs button[aria-selected="true"]{background:var(--lime);color:var(--lime-ink)}

  .kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-block:20px 16px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
  .kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
  .kpi .v{font-family:var(--f-num);font-size:22px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
  .kpi .d{font-size:12px;color:var(--muted);margin-top:2px}

  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
  .bar input[type=search]{flex:1 1 300px;min-width:0;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
  .bar select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);max-width:100%}
  input:focus-visible,select:focus-visible,button:focus-visible,tr:focus-visible{outline:2px solid var(--lime);outline-offset:1px}
  .btn{font:inherit;font-weight:700;font-size:13px;border:none;border-radius:8px;padding:9px 14px;cursor:pointer;background:var(--lime);color:var(--lime-ink)}
  .btn:disabled{opacity:.6;cursor:default}
  .btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:600}
  .count{font-size:12.5px;color:var(--muted);margin-bottom:8px}

  .tw{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
  #pData .tw.main{box-shadow:var(--shadow)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--muted);background:var(--paper);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  th.n,td.n{text-align:right}
  tbody td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle;white-space:nowrap}
  tbody tr:last-child td{border-bottom:none}
  #list tbody tr{cursor:pointer}
  #list tbody tr:hover td{background:var(--hover)}
  td.nm{font-weight:600;max-width:240px;overflow:hidden;text-overflow:ellipsis}
  .z{color:var(--muted)}
  .pill{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;font-family:var(--f-num)}
  .p-good{background:var(--good-soft);color:var(--good)} .p-bad{background:var(--bad-soft);color:var(--bad)}
  .p-warn{background:var(--warn-soft);color:var(--warn)} .p-mut{background:var(--track);color:var(--muted)}
  .pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:13px;color:var(--muted)}

  .scrim{position:fixed;inset:0;background:var(--scrim);z-index:20}
  .sheet{position:fixed;top:0;right:0;bottom:0;width:min(980px,100%);background:var(--paper);z-index:21;overflow-y:auto;box-shadow:var(--shadow);
         padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
  .sheet-h{background:var(--navy);color:var(--navy-ink);padding:18px 20px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;border-bottom:3px solid var(--lime)}
  .sheet-h h2{margin:0;font-size:22px;font-weight:800}
  .sheet-h .meta{font-family:var(--f-num);font-size:12px;color:var(--navy-sub);margin-top:4px;display:flex;gap:14px;flex-wrap:wrap}
  .x{background:transparent;color:var(--navy-ink);border:1px solid var(--navy-sub);border-radius:8px;font:inherit;font-size:13px;padding:6px 12px;cursor:pointer;flex:none}
  .sec{padding:16px 20px 4px}
  .sec h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;font-weight:700}
  .kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .kv div{background:var(--surface);padding:9px 12px;min-width:0}
  .kv .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .kv .v{margin-top:2px;overflow-wrap:anywhere}
  .kv .v.e{color:var(--muted)}
  .sheet table{font-size:12.5px}
  td.prod{max-width:300px;overflow:hidden;text-overflow:ellipsis}

  .asm-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .asm-t{background:var(--surface);padding:10px 12px;min-width:0}
  .asm-t .k,.asm-why .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
  .asm-t .v .pill{font-size:12.5px;padding:2px 10px;font-family:var(--f-body)}
  .asm-t .d{font-size:12px;color:var(--muted);margin-top:6px}
  .asm-t .d b{color:var(--ink);font-family:var(--f-num)}
  .asm-why{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px;margin-top:12px}
  ul.why{list-style:none;margin:0;padding:0;display:grid;gap:5px;font-size:13px}
  ul.why li{padding-left:22px;position:relative}
  ul.why li::before{position:absolute;left:0;top:0;width:16px;text-align:center;font-weight:800}
  ul.why li.pos::before{content:"+";color:var(--good)} ul.why li.neg::before{content:"−";color:var(--bad)} ul.why li.neu::before{content:"•";color:var(--muted)}
  .asm-f{display:grid;gap:4px;font-size:13px}
  .asm-f div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:3px}
  .asm-f span{color:var(--muted)} .asm-f b{font-family:var(--f-num);font-weight:600}
  .asm-disc{font-size:11.5px;color:var(--muted);margin:10px 0 0}
  @media (max-width:760px){.asm-tiles{grid-template-columns:1fr 1fr}.asm-why{grid-template-columns:1fr}}
  footer.note{margin-block:22px 40px;font-size:12.5px;line-height:1.65;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  footer.note b{color:var(--ink)}
  footer.note ul{margin:6px 0 0;padding-left:18px}
  .loading{padding:40px 0;text-align:center;color:var(--muted)}

  /* ---- analysis ---- */
  #pAn{padding-block:20px 40px}
  .an-h{font-size:20px;font-weight:800;margin:30px 0 4px;text-wrap:balance}
  .an-h:first-child{margin-top:4px}
  .an-d{color:var(--muted);margin:0 0 14px;max-width:80ch;font-size:13.5px}
  .finds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .find{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--fc,var(--s1));border-radius:10px;padding:12px 14px;min-width:0}
  .find .t{font-weight:700;margin-bottom:4px}
  .find .b{color:var(--muted);font-size:13.5px}
  .find .b b{color:var(--ink);font-family:var(--f-num);font-weight:600}
  .f-bad{--fc:var(--bad)} .f-good{--fc:var(--good)} .f-warn{--fc:var(--warn)} .f-info{--fc:var(--s1)}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 14px 10px;min-width:0}
  .card h4{margin:0 0 2px;font-size:14px;font-weight:700}
  .card .cd{margin:0 0 10px;font-size:12px;color:var(--muted)}
  .rt td{padding:6px 8px;font-size:12.5px}
  .rt thead th{padding:7px 8px;font-size:10px}
  .bcell{width:42%;min-width:120px}
  .btrack{position:relative;height:16px;border-radius:4px;background:var(--track)}
  .bfill{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--s1)}
  .bval{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--f-num);font-size:11.5px;font-weight:600;color:var(--ink);padding-left:6px;white-space:nowrap}
  .bfill.hi{background:var(--s2)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:2px 0 8px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .chart{width:100%;height:auto;display:block}
  .chart text{fill:var(--muted);font-family:var(--f-num);font-size:10.5px}
  .chart .gl{stroke:var(--grid);stroke-width:1}
  .tip{position:fixed;z-index:30;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:var(--shadow);min-width:150px}
  .tip b{font-family:var(--f-num)}
  .tip .r{display:flex;justify-content:space-between;gap:14px}
  .callout{font-size:12px;color:var(--muted);margin-top:6px}

  @media (max-width:1000px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid2,.finds{grid-template-columns:1fr}}
  @media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kv{grid-template-columns:1fr 1fr}}
  @media (max-width:420px){.kv{grid-template-columns:1fr}}
  @media (prefers-reduced-motion:no-preference){.sheet{animation:in .18s ease-out}@keyframes in{from{transform:translateX(24px)}to{transform:none}}}
</style>

<header class="top gut">
  <div class="wrap">
    <div class="toprow">
      <div>
        <p class="eyebrow" data-t="eyebrow"></p>
        <h1>Customer 360</h1>
        <p class="sub" data-t="sub"></p>
      </div>
      <div class="toggles">
        <div class="seg2" role="group" aria-label="Language"><button type="button" id="lKa" aria-pressed="true">ქარ</button><button type="button" id="lEn" aria-pressed="false">ENG</button></div>
        <button class="iconbtn" id="themeBtn" type="button" aria-label="Light / dark"><svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg></button>
      </div>
    </div>
    <div class="stamp"><span><span data-t="src"></span> <b>VoltaStoreDB</b></span><span><span data-t="asof"></span> <b id="asOf">&nbsp;</b></span></div>
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" id="tData" aria-selected="true" data-t="tabData"></button>
      <button type="button" role="tab" id="tAn" aria-selected="false" data-t="tabAn"></button>
    </nav>
  </div>
</header>

<main class="gut">
  <div class="wrap">
    <section id="pData">
      <div class="kpis" id="kpis"><div class="kpi"><div class="l">&hellip;</div><div class="v">&hellip;</div></div></div>
      <div class="bar">
        <input type="search" id="q" autocomplete="off">
        <select id="seg"></select>
        <select id="sort"></select>
        <button class="btn" id="xlsx" type="button"></button>
      </div>
      <div class="count" id="count"></div>
      <div class="tw main">
        <table id="list"><thead><tr id="listHead"></tr></thead>
          <tbody><tr><td colspan="13" class="loading">&hellip;</td></tr></tbody></table>
      </div>
      <div class="pager"><button class="btn ghost" id="prev" type="button"></button><span id="pg"></span><button class="btn ghost" id="next" type="button"></button></div>
      <footer class="note" id="method"></footer>
    </section>
    <section id="pAn" hidden></section>
  </div>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" hidden aria-modal="true" role="dialog" aria-labelledby="pname"></aside>
<div class="tip" id="tip" hidden></div>

<script src="c360_meta.js" charset="utf-8"></script>
<script src="c360_analysis.js" charset="utf-8"></script>
<script src="c360_cust1.js" charset="utf-8"></script>
<script src="c360_cust2.js" charset="utf-8"></script>
<script src="c360_apps.js" charset="utf-8"></script>
<script src="c360_loans.js" charset="utf-8"></script>
<script>

      k_dpd:'ახლა ვადაგადაცილებული', k_dpdd:'კლიენტი, DPD > 0', k_dpd30:'DPD 30+', k_closed:'დახურული სესხი', k_clean:'ვადაგადაცილების გარეშე',

      f_cleanall:'ყველა დახურული სესხი ვადაგადაცილების გარეშე', f_repeat:'განმეორებითი სესხის კანდიდატი (სუფთად დახურა, ახალი განაცხადი არ შემოუტანია)',

  var METHOD_KA = '<b>როგორ არის დათვლილი.</b><ul>'+
    '<li><b>კლიენტი</b> ერთიანდება პირადი ნომრით (11 ციფრი, განაცხადის ფორმიდან ან კლიენტის ანგარიშიდან). სადაც პირადი ნომერი არ არის, კლიენტი ანგარიშით ან ცალკე განაცხადით ჩანს და ეს პროფილში წერია.</li>'+
    '<li><b>პირადი, დასაქმების და შემოსავლის ველები</b> აღებულია კლიენტის ბოლო განაცხადიდან, სადაც ველი შევსებულია. ფაქტობრივი მისამართი და სამსახური, სადაც ფორმაში არ არის, CRM-ის კლიენტის პროფილიდან მოდის. ხელფასი, დამატებითი შემოსავალი და ვალდებულებები ფორმაში მხოლოდ ბოლო წლების განაცხადებზე ივსება (დაახლოებით მესამედი კლიენტისა).</li>'+
    '<li><b>დადასტურებული</b> = გაცემული განვადება + ერთჯერადი გადახდით შეძენა. <b>უარყოფილი</b> = Volta-ს მიერ უარყოფილი (სტატუსი 6). დანარჩენი (კლიენტის უარი, კონტაქტი ვერ დამყარდა, მოლოდინში) პროფილში ცალკე ჩანს.</li>'+
    '<li><b>მიმდინარე ვალდებულება</b> = აქტიური სესხების გრაფიკის გადაუხდელი ნაწილი, CRM-ის განაწილებით. <b>მიმდინარე DPD</b> = დღეები ყველაზე ძველი გადაუხდელი, ვადაგასული შენატანიდან.</li>'+
    '<li><b>DPD ჯამი</b> = თითოეული შენატანის დაგვიანების დღეების ჯამი, ყველა სესხზე: გრაფიკის თარიღი შედარებულია იმ დღესთან, როცა გადახდების ჯამმა ეს შენატანი დაფარა (ჯარიმის ნაწილი არ ითვლება). ჯერ დაუფარავი შენატანი ითვლება დღევანდელ დღემდე.</li>'+
    '<li><b>დახურული ვადაგადაცილების გარეშე</b> = სესხის არცერთი შენატანი არ დაგვიანებულა თუნდაც 1 დღით. პროფილში ჩანს მაქსიმალური ერთჯერადი დაგვიანებაც. დახურვის თარიღი = დღე, როცა გადახდებმა მთელი გრაფიკი დაფარა (თუ არა, CRM-ის დახურვის თარიღი ან ბოლო გადახდა).</li></ul>';
  var METHOD_EN = '<b>How it is calculated.</b><ul>'+

  function colChart(id, items, val, label, tipf){

    items.forEach(function(d,i){ var v=val(d), h=ih*v/max, x=pl+i*bw+bw*0.18, w=bw*0.64, y=pt+ih-h;
      g+='<path d="M'+x+','+(pt+ih)+' v'+(-(h-4>0?h-4:0))+' q0,-4 4,-4 h'+(w-8)+' q4,0 4,4 v'+(h-4>0?h-4:0)+' z" fill="var(--s1)"'+(tipf&&tipf(d)?' fill-opacity="0.4"':'')+'/>';
      g+='<text x="'+(x+w/2)+'" y="'+(y-4)+'" text-anchor="middle" style="fill:var(--ink);font-weight:600">'+v.toFixed(1)+'</text>';
      g+='<text x="'+(x+w/2)+'" y="'+(H-pb+14)+'" text-anchor="middle">'+label(d)+'</text>';
      g+='<rect x="'+(pl+i*bw)+'" y="'+pt+'" width="'+bw+'" height="'+ih+'" fill="transparent" data-i="'+i+'"/>'; });
    return '<svg class="chart" id="'+id+'" viewBox="0 0 '+W+' '+H+'" role="img">'+g+'</svg>';
  }
  function stackChart(id, items){
    var keys=[['loan',function(d){return d.loan+d.single},'var(--s1)','l_loan'],['rej',function(d){return d.rejected},'var(--s2)','l_rej'],['ref',function(d){return d.refused+d.nocontact},'var(--s3)','l_ref'],['oth',function(d){return d.other},'var(--s4)','l_oth']];
    var W=900, H=260, pl=44, pr=8, pt=12, pb=30, iw=W-pl-pr, ih=H-pt-pb, max=0;
    items.forEach(function(d){ max=Math.max(max,d.apps); }); var step=Math.pow(10,Math.floor(Math.log10(max/4))); var tick=Math.ceil(max/4/step)*step; max=tick*4;
    var bw=iw/items.length, g='';
    for(var k=0;k<=4;k++){ var y=pt+ih-ih*k/4; g+='<line class="gl" x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(pl-6)+'" y="'+(y+3.5)+'" text-anchor="end">'+fm(tick*k)+'</text>'; }
    items.forEach(function(d,i){ var x=pl+i*bw+bw*0.14, w=bw*0.72, y0=pt+ih;
      keys.forEach(function(kk){ var v=kk[1](d), h=ih*v/max; if(h<=0) return; var hh=Math.max(0,h-2); g+='<rect x="'+x+'" y="'+(y0-h)+'" width="'+w+'" height="'+hh+'" fill="'+kk[2]+'"'+(kk[0]==='oth'||true?' rx="1.5"':'')+'/>'; y0-=h; });
      if(d.k.slice(5)==='01'||i===items.length-1) g+='<text x="'+(x+w/2)+'" y="'+(H-pb+14)+'" text-anchor="middle">'+d.k+'</text>';
      g+='<rect x="'+(pl+i*bw)+'" y="'+pt+'" width="'+bw+'" height="'+ih+'" fill="transparent" data-i="'+i+'"/>'; });
    return '<div class="legend">'+keys.map(function(kk){return '<span><i style="background:'+kk[2]+'"></i>'+at(kk[3])+'</span>'}).join('')+'</div><svg class="chart" id="'+id+'" viewBox="0 0 '+W+' '+H+'" role="img">'+g+'</svg>';
  }
  function riskCard(key){
    var rows=AN.risk[key], max=0; rows.forEach(function(r){ if(r.bad!=null) max=Math.max(max,r.bad); });
    var lab=function(k){ return AT[LANG][k]!=null?at(k):k; };
    return '<div class="card"><h4>'+at('r_'+key)+'</h4><div class="tw" style="border:none"><table class="rt"><thead><tr><th>'+at('c_bucket')+'</th><th class="n">'+at('c_loans')+'</th><th>'+at('c_bad')+'</th><th class="n">'+at('c_clean')+'</th><th class="n">'+at('c_cur30')+'</th></tr></thead><tbody>'+
      rows.map(function(r){ return '<tr><td>'+esc(lab(r.k))+'</td><td class="n">'+fm(r.n)+'</td>'+barCell(r.bad,max,false)+'<td class="n">'+pct(r.clean)+'</td><td class="n">'+pct(r.cur30)+'</td></tr>'; }).join('')+'</tbody></table></div></div>';
  }
  function renderAn(){
    var ov=AN.overall;
    var h='<h2 class="an-h">'+at('h_find')+'</h2><p class="an-d">'+at('d_find')+'</p>'+findings();
    h+='<h2 class="an-h">'+at('h_port')+'</h2><p class="an-d">'+at('d_port')+'</p>'+parTable();
    var vint=AN.vint.filter(function(v){return v.n>=200});
    h+='<h2 class="an-h">'+at('h_vint')+'</h2><p class="an-d">'+at('d_vint')+'</p><div class="card">'+colChart('cVint',vint,function(d){return d.bad},function(d){return d.k},function(d){return d===vint[vint.length-1]})+'<p class="callout">'+at('vpart')+'</p>'+
      '<div class="tw" style="border:none;margin-top:6px"><table class="rt"><thead><tr><th>'+at('c_period')+'</th><th class="n">'+at('c_loans')+'</th><th class="n">'+at('c_amt')+'</th><th class="n">'+at('c_bad')+'</th><th class="n">'+at('c_clean')+'</th><th class="n">'+at('c_cur30')+'</th></tr></thead><tbody>'+
      vint.map(function(v){return '<tr><td>'+v.k+'</td><td class="n">'+fm(v.n)+'</td><td class="n">'+fm(v.amt)+'</td><td class="n">'+pct(v.bad)+'</td><td class="n">'+pct(v.clean)+'</td><td class="n">'+(v.active?pct(v.cur30)+' <span class="z">('+v.active+')</span>':'—')+'</td></tr>'}).join('')+'</tbody></table></div></div>';
    h+='<h2 class="an-h">'+at('h_risk')+'</h2><p class="an-d">'+at('d_risk')+' '+(LANG==='ka'?'საშუალოდ':'Overall')+': <b>'+pct(ov.bad)+'</b> ('+fm(ov.n)+' '+(LANG==='ka'?'სესხი':'loans')+').</p><div class="grid2">'+
      ['seq','amt','term','age','gender','emp','sal','obl','dti'].map(riskCard).join('')+'</div><p class="callout">'+at('cav')+'</p>';
    var bmax=0; AN.backtest.forEach(function(b){bmax=Math.max(bmax,b.bad)});
    h+='<h2 class="an-h">'+at('h_bt')+'</h2><p class="an-d">'+at('d_bt')+'</p><div class="tw"><table class="rt"><thead><tr><th>'+at('c_bucket')+'</th><th class="n">'+at('c_loans')+'</th><th>'+at('c_next')+'</th></tr></thead><tbody>'+
      AN.backtest.map(function(b){return '<tr><td>'+at(b.k)+'</td><td class="n">'+fm(b.n)+'</td>'+barCell(b.bad,bmax,b.bad>10)+'</tr>'}).join('')+'</tbody></table></div>';
    h+='<h2 class="an-h">'+at('h_funnel')+'</h2><p class="an-d">'+at('d_funnel')+'</p><div class="card">'+stackChart('cFun',AN.funnel)+'</div>';
    var amax=0; AN.appr.forEach(function(x){amax=Math.max(amax,x.approved)});
    h+='<h2 class="an-h">'+at('h_appr')+'</h2><p class="an-d">'+at('d_appr')+'</p><div class="tw"><table class="rt"><thead><tr><th>'+at('c_bucket')+'</th><th class="n">'+at('c_apps')+'</th><th>'+at('c_approved')+'</th><th class="n">'+at('c_rejected')+'</th><th class="n">'+at('c_refused')+'</th></tr></thead><tbody>'+
      AN.appr.map(function(x){return '<tr><td>'+at(x.k)+'</td><td class="n">'+fm(x.apps)+'</td>'+barCell(x.approved,amax,false)+'<td class="n">'+pct(x.rejected)+'</td><td class="n">'+pct(x.refused)+'</td></tr>'}).join('')+'</tbody></table></div>';
    var stot=0; AN.segs.forEach(function(s){stot+=s.n});
    h+='<h2 class="an-h">'+at('h_seg')+'</h2><p class="an-d">'+at('d_seg')+'</p><div class="tw"><table class="rt"><thead><tr><th>'+at('c_seg')+'</th><th class="n">'+at('c_n')+'</th><th class="n">'+at('c_share')+'</th><th class="n">'+at('c_out')+'</th><th class="n">'+at('c_avgapps')+'</th><th class="n">'+at('c_avgloans')+'</th></tr></thead><tbody>'+
      AN.segs.map(function(s){return '<tr><td>'+at(s.k)+'</td><td class="n">'+fm(s.n)+'</td><td class="n">'+pct(s.n/stot*100)+'</td><td class="n">'+(s.out?fm(s.out):'<span class="z">0</span>')+'</td><td class="n">'+s.apps.toFixed(2)+'</td><td class="n">'+s.loans.toFixed(2)+'</td></tr>'}).join('')+
      '<tr><td><b>'+at('total')+'</b></td><td class="n"><b>'+fm(stot)+'</b></td><td></td><td class="n"><b>'+fm(AN.totals.active_out)+'</b></td><td></td><td></td></tr></tbody></table></div>';
    h+='<h2 class="an-h">'+at('h_rep')+'</h2><p class="an-d">'+at('d_rep')+'</p><div class="tw"><table class="rt"><thead><tr><th>'+at('c_since')+'</th><th class="n">'+at('c_n')+'</th><th class="n">'+at('c_applied')+'</th><th class="n">'+at('c_notapplied')+'</th></tr></thead><tbody>'+
      AN.rep.map(function(r){return '<tr><td>'+at(r.k)+'</td><td class="n">'+fm(r.n)+'</td><td class="n">'+fm(r.applied)+'</td><td class="n"><b>'+fm(r.not_applied)+'</b></td></tr>'}).join('')+'</tbody></table></div>';
    var pa=document.getElementById('pAn'); pa.innerHTML=h;
    var cv=document.getElementById('cVint');
    cv.addEventListener('mousemove',function(e){ var r=e.target.closest('rect[data-i]'); if(!r){hideTip();return;} var v=vint[+r.dataset.i];
      showTip(e,'<div><b>'+v.k+'</b></div><div class="r"><span>'+at('c_loans')+'</span><b>'+fm(v.n)+'</b></div><div class="r"><span>'+at('c_bad')+'</span><b>'+pct(v.bad)+'</b></div><div class="r"><span>'+at('c_clean')+'</span><b>'+pct(v.clean)+'</b></div>'); });
    cv.addEventListener('mouseleave',hideTip);
    var cf=document.getElementById('cFun');
    cf.addEventListener('mousemove',function(e){ var r=e.target.closest('rect[data-i]'); if(!r){hideTip();return;} var d=AN.funnel[+r.dataset.i];
      showTip(e,'<div><b>'+d.k+'</b> · '+fm(d.apps)+' '+at('ofApps')+'</div><div class="r"><span>'+at('l_loan')+'</span><b>'+fm(d.loan+d.single)+'</b></div><div class="r"><span>'+at('l_rej')+'</span><b>'+fm(d.rejected)+'</b></div><div class="r"><span>'+at('l_ref')+'</span><b>'+fm(d.refused+d.nocontact)+'</b></div><div class="r"><span>'+at('l_oth')+'</span><b>'+fm(d.other)+'</b></div>'); });
    cf.addEventListener('mouseleave',hideTip);
  }

  // ================= tabs + language =================
  var TAB='data';
  function setTab(tb){ TAB=tb; document.getElementById('tData').setAttribute('aria-selected',tb==='data'); document.getElementById('tAn').setAttribute('aria-selected',tb==='analysis');
    document.getElementById('pData').hidden = tb!=='data'; document.getElementById('pAn').hidden = tb!=='analysis'; if(tb==='analysis') renderAn(); hideTip();
    try{ history.replaceState(null,'',tb==='analysis'?'#analysis':'#data'); }catch(e){} }
  document.getElementById('tData').addEventListener('click',function(){setTab('data')});
  document.getElementById('tAn').addEventListener('click',function(){setTab('analysis')});
  function setLang(lg){ LANG=lg; try{localStorage.setItem('voltaLang',lg)}catch(e){}
    document.documentElement.lang = lg==='ka'?'ka':'en';
    document.getElementById('lKa').setAttribute('aria-pressed',lg==='ka'); document.getElementById('lEn').setAttribute('aria-pressed',lg==='en');
    document.querySelectorAll('[data-t]').forEach(function(el){ el.textContent=t(el.getAttribute('data-t')); });
    fillControls(); render(); if(TAB==='analysis') renderAn(); if(openIdx>=0) openP(openIdx); paintTheme(); }
  document.getElementById('lKa').addEventListener('click',function(){setLang('ka')});
  document.getElementById('lEn').addEventListener('click',function(){setLang('en')});

  setLang(LANG); apply();
  if(location.hash==='#analysis') setTab('analysis');
})();
</script>
