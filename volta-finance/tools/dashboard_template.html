<meta charset="utf-8">
<title>Volta_Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F3F5F4; --surface:#FFFFFF; --surface2:#EBEFEE; --ink:#16202A; --muted:#5B6B78; --faint:#8A98A3;
  --line:#D7DDDE; --line2:#E7ECEC; --accent:#1470A6; --accent-ink:#FFFFFF; --accent-soft:#E2EEF6;
  --amber:#C9722A; --amber-soft:#F7EADF; --pos:#2A7F5A; --neg:#B23F2E; --pos-soft:#E1F1E9; --neg-soft:#F6E3DF;
  --heat:20,112,166; --shadow:0 1px 2px rgba(22,32,42,.06),0 4px 14px rgba(22,32,42,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#12171B; --surface:#1A2126; --surface2:#222A30; --ink:#E4E9EC; --muted:#93A1AB; --faint:#6E7C86;
    --line:#2C363D; --line2:#242D34; --accent:#3A8DBA; --accent-ink:#0E141A; --accent-soft:#1E3241;
    --amber:#C27F3C; --amber-soft:#3A2B1B; --pos:#4CAF84; --neg:#E06A57; --pos-soft:#1B3328; --neg-soft:#3B221E;
    --heat:58,141,186; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#12171B; --surface:#1A2126; --surface2:#222A30; --ink:#E4E9EC; --muted:#93A1AB; --faint:#6E7C86;
  --line:#2C363D; --line2:#242D34; --accent:#3A8DBA; --accent-ink:#0E141A; --accent-soft:#1E3241;
  --amber:#C27F3C; --amber-soft:#3A2B1B; --pos:#4CAF84; --neg:#E06A57; --pos-soft:#1B3328; --neg-soft:#3B221E;
  --heat:58,141,186; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Georgian","Sylfaen","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.45}
.num,.code,td.n,th.n{font-family:"IBM Plex Mono","Consolas",monospace;font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1380px;margin:0 auto;padding:18px 28px 0;display:flex;flex-wrap:wrap;gap:12px 32px;align-items:flex-end;justify-content:space-between}
.brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.brand .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.brand .sub b{color:var(--ink);font-weight:500}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-bottom:14px}
.ctl-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-right:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface2)}
.seg button{padding:6px 11px;font-size:13px;font-weight:500;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.lang button{padding:6px 10px;font-size:12px;letter-spacing:.04em}
select{font:inherit;font-size:13px;padding:6px 28px 6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);color:var(--ink);appearance:none;
 background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.tabs{max-width:1380px;margin:0 auto;padding:0 28px;display:flex;gap:2px;overflow-x:auto}
.tabs button{padding:10px 14px;font-size:13.5px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}

main{max-width:1380px;margin:0 auto;padding:22px 28px 60px}
.panel{display:none}.panel.on{display:block}
.period{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;margin:0 0 16px}
.period h2{margin:0;font-size:17px;font-weight:600}
.period .win{color:var(--muted);font-size:13px}
.period .win b{color:var(--ink);font-weight:500}
.note{color:var(--muted);font-size:12.5px;margin:10px 0 0;max-width:80ch}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:12px 14px 11px}
.kpi .l{font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.kpi .v{font-size:21px;font-weight:600;margin-top:4px;letter-spacing:-.01em}
.kpi .d{font-size:12px;margin-top:3px;color:var(--muted)}
.kpi .d .up{color:var(--pos)}.kpi .d .dn{color:var(--neg)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line2);border-radius:8px;box-shadow:var(--shadow);padding:14px 16px 12px}
.card h3{margin:0 0 2px;font-size:14px;font-weight:600}
.card .cap{color:var(--muted);font-size:12px;margin-bottom:8px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:2px 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:5px;white-space:nowrap;transform:translate(-50%,-110%);display:none;z-index:5;box-shadow:var(--shadow)}
.tip b{font-weight:600}

.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line2);border-radius:8px;box-shadow:var(--shadow)}
table.ledger{border-collapse:collapse;width:100%;min-width:640px}
.ledger th{font-size:11.5px;font-weight:500;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);letter-spacing:.02em;white-space:nowrap;background:var(--surface)}
.ledger th.n,.ledger td.n{text-align:right}
.ledger td{padding:6px 12px;border-bottom:1px solid var(--line2);vertical-align:middle;white-space:nowrap}
.ledger td.name{white-space:normal;min-width:260px;max-width:520px}
#p-ex .ledger td.name{white-space:nowrap;min-width:0;max-width:none}
.ledger tr:last-child td{border-bottom:0}
.ledger tr.lvl1 td{font-weight:600;background:var(--surface2)}
.ledger tr.lvl2 td{font-weight:500}
.ledger tr.total td{font-weight:600;border-top:2px solid var(--line);background:var(--surface2)}
.ledger tr.sub td{font-weight:600;border-top:1px solid var(--line)}
.ledger tr.head td{font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;padding-top:14px;font-weight:500}
.ledger td.n.neg{color:var(--neg)}
.ledger td.n.zero{color:var(--faint)}
.ledger td.n.pos{color:var(--pos)}
.code{color:var(--faint);font-size:11.5px;margin-right:8px}
.tg{display:inline-block;width:16px;height:16px;line-height:14px;text-align:center;border:1px solid var(--line);border-radius:3px;font-size:11px;color:var(--muted);margin-right:6px;vertical-align:1px;background:var(--surface)}
.tg.open{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.tg.none{visibility:hidden}
.ind1{padding-left:22px}.ind2{padding-left:44px}.ind3{padding-left:66px}.ind4{padding-left:88px}
.more{padding:8px 12px;font-size:12.5px;color:var(--accent);font-weight:500}
.pct{color:var(--muted);font-size:11.5px;margin-left:6px}
.bar{display:inline-block;height:6px;border-radius:3px;background:var(--accent);vertical-align:middle;margin-right:8px;opacity:.75}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px}
.toolbar input[type=search]{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);min-width:260px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills button{padding:5px 11px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;color:var(--muted);background:var(--surface)}
.pills button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}
.heat{background:rgba(var(--heat),calc(var(--h) * .28))}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--surface2);color:var(--muted);margin-left:6px;vertical-align:1px}
.check{margin-top:10px;font-size:12.5px;color:var(--muted)}
.check .ok{color:var(--pos);font-weight:500}
.check .bad{color:var(--neg);font-weight:500}
.mt{margin-top:18px}
footer{max-width:1380px;margin:0 auto;padding:0 28px 40px;color:var(--faint);font-size:12px}
@media (prefers-reduced-motion:no-preference){.chart rect,.chart circle{transition:opacity .15s}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1 id="h-title"></h1>
      <div class="sub" id="h-sub"></div>
    </div>
    <div class="controls">
      <span class="ctl-label" id="l-year"></span><div class="seg" id="years"></div>
      <span class="ctl-label" id="l-month"></span><select id="month"></select>
      <div class="seg lang" id="lang"><button data-l="ka">ქარ</button><button data-l="en">EN</button></div>
    </div>
  </div>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-p="ov"></button>
    <button role="tab" data-p="bs"></button>
    <button role="tab" data-p="pl"></button>
    <button role="tab" data-p="tb"></button>
    <button role="tab" data-p="cf"></button>
    <button role="tab" data-p="ar"></button>
    <button role="tab" data-p="ex"></button>
  </nav>
</header>

<main>
  <section class="panel" id="p-ov"></section>
  <section class="panel" id="p-bs"></section>
  <section class="panel" id="p-pl"></section>
  <section class="panel" id="p-tb"></section>
  <section class="panel" id="p-cf"></section>
  <section class="panel" id="p-ar"></section>
  <section class="panel" id="p-ex"></section>
</main>
<footer id="foot"></footer>
<div class="tip" id="tip"></div>

    const has=kids.length>0 && lv<maxL;
    const id=opts.prefix+code;
    const isOpen = state.open.has(id) || (lv<= (opts.openTo||1));
    out.push(opts.row(code,lv,has,isOpen,id));
    if(has && isOpen){
      let list=kids;
      if(kids.length>150){ list=kids.slice().sort((a,b)=>Math.abs(opts.sortVal(b,st))-Math.abs(opts.sortVal(a,st))).slice(0,150); }
      for(const k of list) walk(k,lv+1);
      if(kids.length>150) out.push(`<tr><td colspan="9" class="more ind${Math.min(lv,4)}">${T().shownTop(150,kids.length)}</td></tr>`);
    }
  };
  for(const r of roots) walk(r,1);
  return out.join('');
}

function niceMax(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); const f=v/p; const n= f<=1?1: f<=2?2: f<=2.5?2.5: f<=5?5:10; return n*p; }

function barChart(el, labels, series, line){

function lineChart(el, labels, series){

/* ---------- P&L model ---------- */
function plLines(st){
  const inc=c=>{const v=S(st,c); return v.c-v.d;}, exp=c=>{const v=S(st,c); return v.d-v.c;};
  const rev=inc('6'), cogs=exp('7 2')+exp('7 1'), gross=rev-cogs, dist=exp('7 3'), adm=exp('7 4'), op=gross-dist-adm;
  const noi=inc('8 1'), noe=exp('8 2'), ext=inc('9 1'), oth=exp('9 2'); const net=op+noi-noe+ext-oth;
  return {rev,cogs,gross,dist,adm,op,noi,noe,ext,oth,net};
}
function cashClose(st){ return close(S(st,'1 1'))+close(S(st,'1 2')); }
const kpi=(l,v,d)=>`<div class="kpi"><div class="l">${l}</div><div class="v num">${typeof v==='number'?fmt(v,0)+gel:v}</div><div class="d">${d||''}</div></div>`;

/* ---------- CASH FLOW ---------- */
const CF_RULES=[
  c=>c.startsWith('1 4 10')||c.startsWith('3 1 20'),
  c=>c.startsWith('3 1 10')||c.startsWith('3 1 31'),
  c=>c.startsWith('1 6')||c.startsWith('7 2')||c.startsWith('7 1'),
  c=>c.startsWith('3 1 32')||c.startsWith('3 1 30')||c.startsWith('7 4 10')||c.startsWith('1 4 30')||c.startsWith('3 1 60'),
  c=>c.startsWith('3 3'),
  c=>c.startsWith('3 2')||c.startsWith('4 1')||c.startsWith('4 2')||c.startsWith('1 4 50'),
  c=>c.startsWith('5'),
  c=>c.startsWith('2')||c.startsWith('1 3'),
  c=>c.startsWith('7'),
  c=>c.startsWith('8')||c.startsWith('9'),
  c=>true];
function cfGroup(c){ for(let i=0;i<CF_RULES.length;i++) if(CF_RULES[i](c)) return i; return CF_RULES.length-1; }
const isCash=c=>c.startsWith('1 1')||c.startsWith('1 2');
function renderCF(){
  const t=T(); const P=period(); const st=stats(P.s,P.e);
  const groups=new Map(); const byAcc=new Map(); let tin=0,tout=0,trIn=0,trOut=0;
  for(const [cash,ctr,m,i,o] of D.cf){ if(m<P.s||m>P.e) continue;
    const a=byAcc.get(cash)||{i:0,o:0,ti:0,to:0}; byAcc.set(cash,a);
    if(isCash(ctr)){ a.ti+=i; a.to+=o; trIn+=i; trOut+=o; continue; }
    a.i+=i; a.o+=o; tin+=i; tout+=o;
    const g=cfGroup(ctr); const G=groups.get(g)||{i:0,o:0,items:new Map()}; groups.set(g,G); G.i+=i; G.o+=o;
    const it=G.items.get(ctr)||{i:0,o:0}; it.i+=i; it.o+=o; G.items.set(ctr,it); }
  const open=S(st,'1 1').o+S(st,'1 2').o, end=cashClose(st);
  let h=periodHead(t.cfTitle, `${t.period}: <b>${P.label}</b> · ${t.cfSub}`);
  h+=`<div class="kpis">${kpi(t.cashOpen,open)}${kpi(t.inflow,tin)}${kpi(t.outflow,tout)}${kpi(t.netFlow,tin-tout)}${kpi(t.cashEnd,end)}</div>`;
  const ys=monthsOf(state.year); const labels=ys.map(i=>GM()[+M[i].slice(5)-1]); const inV=ys.map(()=>0), outV=ys.map(()=>0);
  for(const [cash,ctr,m,i,o] of D.cf){ const j=ys.indexOf(m); if(j<0||isCash(ctr)) continue; inV[j]+=i; outV[j]+=o; }
  h+=`<div class="card"><h3>${t.cfChart}</h3><div class="cap">${yLbl(state.year)}, ${t.cfChartCap}</div><div class="legend"><span><i style="background:${cssVar('--accent')}"></i>${t.inflow}</span><span><i style="background:${cssVar('--amber')}"></i>${t.outflow}</span></div><div class="chart" id="c-cf"></div></div>`;
  h+=`<div class="tablewrap mt"><table class="ledger"><thead><tr><th>${t.flowCtr}</th><th class="n">${t.inflow}</th><th class="n">${t.outflow}</th><th class="n">${t.netCol}</th></tr></thead><tbody>`;
  for(let gi=0; gi<CF_RULES.length; gi++){ if(!groups.has(gi)) continue; const G=groups.get(gi); const id='cf'+gi; const open_=state.open.has(id);
    h+=`<tr class="lvl2"><td class="name">${tgl(true,open_,id)}${esc(t.cfGroups[gi])}</td>${cell(G.i)}${cell(G.o)}${cell(G.i-G.o)}</tr>`;
    if(open_){ const items=[...G.items.entries()].sort((a,b)=>(b[1].i+b[1].o)-(a[1].i+a[1].o)); for(const [c,it] of items) h+=`<tr><td class="name ind1"><span class="code">${esc(c)}</span>${esc(name(c))}</td>${cell(it.i)}${cell(it.o)}${cell(it.i-it.o)}</tr>`; } }
  h+=`<tr class="total"><td>${t.total}</td>${cell(tin)}${cell(tout)}${cell(tin-tout)}</tr>`;
  h+=`<tr><td class="name" style="color:var(--muted)">${t.transfers}</td>${cell(trIn)}${cell(trOut)}${cell(trIn-trOut)}</tr></tbody></table></div>`;
  h+=`<div class="tablewrap mt"><table class="ledger"><thead><tr><th>${t.account}</th><th class="n">${t.atStart}</th><th class="n">${t.inflow}</th><th class="n">${t.outflow}</th><th class="n">${t.transfersNet}</th><th class="n">${t.atEnd}</th></tr></thead><tbody>`;
  const accs=[...new Set([...byAcc.keys(), ...Object.keys(ACC).filter(c=>isCash(c)&&level(c)>=3&&!children[c]&&Math.abs(close(S(st,c)))>0.004)])].sort(cmpCode);
  for(const c of accs){ const a=byAcc.get(c)||{i:0,o:0,ti:0,to:0}; const v=S(st,c); if(Math.abs(v.o)+v.d+v.c<0.004) continue; h+=`<tr><td class="name"><span class="code">${esc(c)}</span>${esc(name(c))}</td>${cell(v.o)}${cell(a.i)}${cell(a.o)}${cell(a.ti-a.to)}${cell(close(v))}</tr>`; }
  h+=`<tr class="total"><td>${t.totCash}</td>${cell(open)}${cell(tin)}${cell(tout)}${cell(trIn-trOut)}${cell(end)}</tr></tbody></table></div>`;
  h+=`<p class="note">${t.cfNote}</p>`;
  const el=document.getElementById('p-cf'); el.innerHTML=h;
  barChart(el.querySelector('#c-cf'),labels,[{name:t.inflow,color:cssVar('--accent'),vals:inV},{name:t.outflow,color:cssVar('--amber'),vals:outV}],null);
}

/* ---------- AR / AP ---------- */
const AR_LEDGERS=['1 4 10','3 1 20','3 1 10','3 1 31','3 1 32','4 1 90','3 2 10','1 4 30','1 4 50'];
function renderAR(){
  const t=T(); const P=period(); const st=stats(P.s,P.e); const led=state.arLedger; const isA=led[0]==='1'; const sign=isA?1:-1;
  let rows=(children[led]||[]).map(c=>{ const v=S(st,c); return {c,o:v.o*sign,d:v.d,k:v.c,e:close(v)*sign}; }).filter(r=>Math.abs(r.o)+r.d+r.k>0.004);
  const q=state.arQ.trim().toLowerCase(); if(q) rows=rows.filter(r=>name(r.c).toLowerCase().includes(q)||r.c.toLowerCase().includes(q));
  rows.sort((a,b)=>Math.abs(b.e)-Math.abs(a.e));
  const tot=rows.reduce((x,r)=>{x.o+=r.o;x.d+=r.d;x.k+=r.k;x.e+=r.e;return x;},{o:0,d:0,k:0,e:0});
  const nz=rows.filter(r=>Math.abs(r.e)>0.004).length; const opp=rows.filter(r=>r.e<-0.004);
  const top10=rows.slice(0,10).reduce((s,r)=>s+Math.max(r.e,0),0); const posTot=rows.reduce((s,r)=>s+Math.max(r.e,0),0);
  let h=periodHead(t.arTitle, `${t.asOf}: <b>${endOfLbl(P.e)}</b> · ${t.turnover}: ${P.label}`);
  h+=`<div class="toolbar"><div class="pills">${AR_LEDGERS.filter(l=>children[l]).map(l=>`<button data-led="${l}" aria-pressed="${l===led}"><span class="code" style="margin-right:5px">${l}</span>${t.arLedgers[l]}</button>`).join('')}</div></div>`;
  h+=`<div class="toolbar"><input type="search" id="arq" placeholder="${t.search}" value="${esc(state.arQ)}"><span style="color:var(--muted);font-size:12.5px">${rows.length} ${t.contragents}${q?' '+t.filtered:''}</span></div>`;
  h+=`<div class="kpis">${kpi(t.balEnd,tot.e,`${t.atStartLbl}: ${fmt(tot.o,0)} ₾`)}${kpi(t.toDr,tot.d)}${kpi(t.toCr,tot.k)}${kpi(t.nonZero,'<span class="num">'+nz+'</span>',`${t.top10}: ${posTot?(top10/posTot*100).toFixed(0):0}% ${t.ofBal}`)}${kpi(isA?t.oppA:t.oppL,'<span class="num">'+opp.length+'</span>',`${fmt(opp.reduce((s,r)=>s+r.e,0),0)} ₾`)}</div>`;
  const mx=Math.max(...rows.map(r=>Math.abs(r.e)),1);
  h+=`<div class="tablewrap"><table class="ledger"><thead><tr><th>${t.code}</th><th>${t.contragent}</th><th class="n">${t.openBal}</th><th class="n">${t.debit}</th><th class="n">${t.credit}</th><th class="n">${t.closeBal}</th><th></th></tr></thead><tbody>`;
  const show=rows.slice(0,state.arN);
  for(const r of show) h+=`<tr><td class="code" style="margin:0">${esc(r.c.slice(led.length+1))}</td><td class="name">${esc(name(r.c))}</td>${cell(r.o)}${cell(r.d)}${cell(r.k)}${cell(r.e)}<td style="width:130px"><span class="bar" style="width:${(Math.abs(r.e)/mx*110).toFixed(0)}px;${r.e<0?'background:var(--neg)':''}"></span></td></tr>`;
  h+=`<tr class="total"><td colspan="2">${t.total} (${rows.length})</td>${cell(tot.o)}${cell(tot.d)}${cell(tot.k)}${cell(tot.e)}<td></td></tr></tbody></table>`;
  if(rows.length>state.arN) h+=`<div class="more"><button id="armore" style="color:var(--accent);font-weight:500">${t.showMore(Math.min(300,rows.length-state.arN),rows.length)}</button></div>`;
  h+=`</div><p class="note">${isA?t.arNoteA:t.arNoteL} ${t.negRed}</p>`;
  const el=document.getElementById('p-ar'); el.innerHTML=h;
  el.querySelectorAll('[data-led]').forEach(b=>b.addEventListener('click',()=>{ state.arLedger=b.dataset.led; state.arN=100; renderAR(); }));
  const inp=el.querySelector('#arq'); let tm; inp.addEventListener('input',()=>{ clearTimeout(tm); tm=setTimeout(()=>{ state.arQ=inp.value; state.arN=100; const pos=inp.selectionStart; renderAR(); const n=document.getElementById('arq'); n.focus(); n.setSelectionRange(pos,pos); },250); });
  const mb=el.querySelector('#armore'); if(mb) mb.addEventListener('click',()=>{ state.arN+=300; renderAR(); });
}

/* ---------- EXPENSES ---------- */
function renderEX(){
  const t=T(); const ys=monthsOf(state.year);
  const ms=ys.map(i=>stats(i,i)); const yst=stats(ys[0],ys[ys.length-1]);
  const val=(s,c)=>{ const v=S(s,c); return v.d-v.c; };
  const roots=['7 4','7 3','7 1','8 2','9 2'];
  const keep=(k,s)=>Math.abs(val(yst,k))>0.004 || (S(yst,k).d+S(yst,k).c)>0.004;
  const row=(code,lv,has,open,id)=>{ const vals=ms.map(s=>val(s,code)); const mx=Math.max(...vals.map(Math.abs),0.01); const tot=val(yst,code); const l=lv<=1?'lvl1':lv===2?'lvl2':'';
    return `<tr class="${l}">${nameCell(code,lv,has,open,id)}${vals.map(v=>`<td class="n ${lv>=2?'heat':''}" style="--h:${(Math.abs(v)/mx).toFixed(2)}">${Math.abs(v)<0.005?'<span style="color:var(--faint)">·</span>':fmt(v,0)}</td>`).join('')}${cell(tot)}<td class="n">${fmt(tot/ys.length,0)}</td></tr>`; };
  const opts={prefix:'ex',openTo:1,maxLevel:4,keep,row,sortVal:(k,s)=>val(yst,k)};
  const total=roots.reduce((s,c)=>s+val(yst,c),0); const rev=plLines(yst).rev;
  let h=periodHead(t.exTitle, `${t.year}: <b>${state.year}</b> · ${t.exSub}${state.month!==null?` · ${t.selMonth}: ${GMF()[+state.month-1]}`:''}`);
  h+=`<div class="kpis">${kpi(t.ga,val(yst,'7 4'),rev?`${(val(yst,'7 4')/rev*100).toFixed(1)}% ${t.ofRev}`:'')}${kpi(t.dist,val(yst,'7 3'))}${kpi(t.nonOpEx,val(yst,'8 2'))}${kpi(t.totEx,total,`${t.avgMonth} ${fmt(total/ys.length,0)} ₾`)}</div>`;
  h+=`<div class="tablewrap"><table class="ledger"><thead><tr><th>${t.exItem}</th>${ys.map(i=>`<th class="n" ${state.month!==null&&M[i].slice(5)===state.month?'style="color:var(--accent)"':''}>${GM()[+M[i].slice(5)-1]}</th>`).join('')}<th class="n">${t.total} ${state.year}</th><th class="n">${t.avgCol}</th></tr></thead><tbody>`;
  h+=treeRows(roots,yst,opts);
  h+=`<tr class="total"><td>${t.total}</td>${ys.map((i,j)=>cell(roots.reduce((s,c)=>s+val(ms[j],c),0))).join('')}${cell(total)}<td class="n">${fmt(total/ys.length,0)}</td></tr></tbody></table></div>`;
  h+=`<p class="note">${t.exNote}</p>`;
  document.getElementById('p-ex').innerHTML=h;
}

/* ---------- wiring ---------- */
const R={ov:renderOV,bs:renderBS,pl:renderPL,tb:renderTB,cf:renderCF,ar:renderAR,ex:renderEX};
function render(){ document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+state.tab)); document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.p===state.tab)); R[state.tab](); }
function buildChrome(){
  const t=T(); document.documentElement.lang=state.lang;
  document.getElementById('h-title').textContent=t.title;
  const dmy=s=>s.split('-').reverse().join('.');
  document.getElementById('h-sub').innerHTML=`${t.src} <b>${dmy(D.meta.asof)}</b> · ${t.journal} <b>${dmy(D.meta.first)} – ${dmy(D.meta.last)}</b> · ${t.allGel}`;
  document.getElementById('l-year').textContent=t.year; document.getElementById('l-month').textContent=t.month;
  document.querySelectorAll('#tabs button').forEach(b=>b.textContent=t.tabs[b.dataset.p]);
  document.querySelectorAll('#lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===state.lang));
  const s=D.meta.stats; document.getElementById('foot').textContent=t.foot({total:fmt(s.total,0),kept:fmt(s.kept,0),closing:fmt(s.skip_closing,0),offbal:s.skip_offbal},s.fx_converted);
  const yr=document.getElementById('years'); yr.innerHTML=years.map(y=>`<button aria-pressed="${y===state.year}" data-y="${y}">${y}</button>`).join('');
  yr.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ state.year=b.dataset.y; if(state.month!==null && M.indexOf(`${state.year}-${state.month}`)<0) state.month=null; buildChrome(); render(); }));
  const ms=document.getElementById('month'); const avail=monthsOf(state.year).map(i=>M[i].slice(5));
  ms.innerHTML=`<option value="">${t.wholeYear}</option>`+avail.map(m=>`<option value="${m}" ${state.month===m?'selected':''}>${t.mL[+m-1]}</option>`).join('');
  ms.onchange=()=>{ state.month=ms.value||null; render(); };
}
document.getElementById('lang').addEventListener('click',e=>{ const b=e.target.closest('button[data-l]'); if(!b) return; state.lang=b.dataset.l; try{localStorage.setItem('volta-fin-lang',state.lang);}catch(_){} buildChrome(); render(); });
document.getElementById('tabs').addEventListener('click',e=>{ const b=e.target.closest('button[data-p]'); if(!b) return; state.tab=b.dataset.p; try{localStorage.setItem('volta-fin-tab',state.tab);}catch(_){} render(); });
document.querySelector('main').addEventListener('click',e=>{ const t=e.target.closest('[data-tg]'); if(!t) return; const id=t.dataset.tg; if(state.open.has(id)) state.open.delete(id); else state.open.add(id); render(); });
try{ const t=localStorage.getItem('volta-fin-tab'); if(t&&R[t]) state.tab=t; }catch(_){}
buildChrome(); render();
</script>
