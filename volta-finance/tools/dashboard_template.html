<meta charset="utf-8">
<title>Volta_Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F3F5F4; --surface:#FFFFFF; --surface2:#EBEFEE; --ink:#16202A; --muted:#5B6B78; --faint:#8A98A3;
  --line:#D7DDDE; --line2:#E7ECEC; --accent:#1470A6; --accent-ink:#FFFFFF; --accent-soft:#E2EEF6;
  --amber:#C9722A; --amber-soft:#F7EADF; --pos:#2A7F5A; --neg:#B23F2E; --pos-soft:#E1F1E9; --neg-soft:#F6E3DF;
  --heat:20,112,166; --shadow:0 1px 2px rgba(22,32,42,.06),0 4px 14px rgba(22,32,42,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#12171B; --surface:#1A2126; --surface2:#222A30; --ink:#E4E9EC; --muted:#93A1AB; --faint:#6E7C86;
    --line:#2C363D; --line2:#242D34; --accent:#3A8DBA; --accent-ink:#0E141A; --accent-soft:#1E3241;
    --amber:#C27F3C; --amber-soft:#3A2B1B; --pos:#4CAF84; --neg:#E06A57; --pos-soft:#1B3328; --neg-soft:#3B221E;
    --heat:58,141,186; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#12171B; --surface:#1A2126; --surface2:#222A30; --ink:#E4E9EC; --muted:#93A1AB; --faint:#6E7C86;
  --line:#2C363D; --line2:#242D34; --accent:#3A8DBA; --accent-ink:#0E141A; --accent-soft:#1E3241;
  --amber:#C27F3C; --amber-soft:#3A2B1B; --pos:#4CAF84; --neg:#E06A57; --pos-soft:#1B3328; --neg-soft:#3B221E;
  --heat:58,141,186; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Georgian","Sylfaen","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.45}
.num,.code,td.n,th.n{font-family:"IBM Plex Mono","Consolas",monospace;font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1380px;margin:0 auto;padding:18px 28px 0;display:flex;flex-wrap:wrap;gap:12px 32px;align-items:flex-end;justify-content:space-between}
.brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.brand .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.brand .sub b{color:var(--ink);font-weight:500}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-bottom:14px}
.ctl-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-right:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface2)}
.seg button{padding:6px 11px;font-size:13px;font-weight:500;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.lang button{padding:6px 10px;font-size:12px;letter-spacing:.04em}
.seg.theme button{padding:5px 11px;font-size:14px;line-height:1}
select{font:inherit;font-size:13px;padding:6px 28px 6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);color:var(--ink);appearance:none;
 background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.tabs{max-width:1380px;margin:0 auto;padding:6px 28px 0;display:flex;flex-direction:column;gap:5px}
.tab-row-wrap{display:flex;flex-direction:column;gap:1px}
.tab-row-label{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:0 2px}
.tab-row{display:flex;gap:2px;overflow-x:auto;overflow-y:hidden}
.tabs button{padding:10px 14px;font-size:13.5px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}

main{max-width:1380px;margin:0 auto;padding:22px 28px 60px}
.panel{display:none}.panel.on{display:block}
.period{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;margin:0 0 16px}
.period h2{margin:0;font-size:17px;font-weight:600}
.period .win{color:var(--muted);font-size:13px}
.period .win b{color:var(--ink);font-weight:500}
.note{color:var(--muted);font-size:12.5px;margin:10px 0 0;max-width:80ch}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:12px 14px 11px}
.kpi .l{font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.kpi .v{font-size:21px;font-weight:600;margin-top:4px;letter-spacing:-.01em}
.kpi .d{font-size:12px;margin-top:3px;color:var(--muted)}
.kpi .d .up{color:var(--pos)}.kpi .d .dn{color:var(--neg)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line2);border-radius:8px;box-shadow:var(--shadow);padding:14px 16px 12px}
.card h3{margin:0 0 2px;font-size:14px;font-weight:600;display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.compact-btn{font-size:11.5px;font-weight:500;color:var(--accent);border:1px solid var(--line);border-radius:6px;padding:4px 10px;background:var(--surface2);white-space:nowrap;margin-left:auto}
.compact-btn:hover{background:var(--accent-soft)}
.ledger td.n.clickable{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px;text-decoration-color:var(--faint)}
.ledger td.n.clickable:hover{background:var(--accent-soft);color:var(--accent)}
.ledger td.n.cell-open{background:var(--accent-soft);color:var(--accent);font-weight:600;text-decoration:none}
.postings-wrap{padding:4px 12px 10px 34px;position:sticky;left:0;width:-moz-fit-content;width:fit-content;max-width:calc(100vw - 48px);overflow-x:auto}
.postings-wrap .more{color:var(--muted);font-size:11px;margin-top:4px}
table.postings{border-collapse:collapse;width:auto;font-size:12px}
table.postings th{font-size:10px;font-weight:500;color:var(--muted);text-align:left;padding:3px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.postings th.n,table.postings td.n{text-align:right}
table.postings td{padding:3px 8px;border-bottom:1px solid var(--line2);white-space:nowrap;line-height:1.35;vertical-align:top}
table.postings td.purpose{white-space:normal;width:240px;max-width:240px}
@media (max-width:700px){ table.postings td.purpose{width:150px;max-width:150px} }
.card .cap{color:var(--muted);font-size:12px;margin-bottom:8px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:2px 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:5px;white-space:nowrap;transform:translate(-50%,-110%);display:none;z-index:5;box-shadow:var(--shadow)}
.tip b{font-weight:600}

.tablewrap{overflow-x:auto;overflow-y:visible;background:var(--surface);border:1px solid var(--line2);border-radius:8px;box-shadow:var(--shadow);position:relative}
.top-scroll{overflow-x:auto;overflow-y:hidden;height:14px}
.top-scroll>div{height:1px}
table.ledger{border-collapse:collapse;width:100%;min-width:640px}
.ledger th{font-size:11.5px;font-weight:500;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);letter-spacing:.02em;white-space:nowrap;background:var(--surface);position:sticky;top:0;z-index:2}
.ledger th.n,.ledger td.n{text-align:right}
.ledger .mg-first{border-left:2px solid var(--line)}
.ledger td.mg-alt,.ledger th.mg-alt{background-image:linear-gradient(rgba(127,127,127,.09),rgba(127,127,127,.09)) !important}
.ledger th.mg-head{text-align:center;font-size:13px;font-weight:700;color:var(--accent);border-bottom:2px solid var(--accent);letter-spacing:.04em}

.ledger td{padding:6px 12px;border-bottom:1px solid var(--line2);vertical-align:middle;white-space:nowrap}
.ledger td.name{white-space:normal;min-width:340px;max-width:600px;position:sticky;left:0;z-index:1;background:var(--surface)}
.ledger thead th:first-child{left:0;z-index:3}
#p-ex .ledger td.name{white-space:nowrap;min-width:0;max-width:none}
.ledger tr:last-child td{border-bottom:0}
.ledger tr.lvl1 td{font-weight:600;background:var(--surface2)}
.ledger tr.lvl2 td{font-weight:500}
.ledger tr.total td{font-weight:600;border-top:2px solid var(--line);background:var(--surface2)}
.ledger tr.sub td{font-weight:600;border-top:1px solid var(--line)}
.ledger tr.head td{font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;padding-top:14px;font-weight:500}
.ledger td.n.neg{color:var(--neg)}
.ledger td.n.zero{color:var(--faint)}
.ledger td.n.pos{color:var(--pos)}
.code{color:var(--faint);font-size:11.5px;margin-right:8px}
.tg{display:inline-block;width:16px;height:16px;line-height:14px;text-align:center;border:1px solid var(--line);border-radius:3px;font-size:11px;color:var(--muted);margin-right:6px;vertical-align:1px;background:var(--surface)}
.tg.open{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.tg.none{visibility:hidden}
.ind1{padding-left:22px}.ind2{padding-left:44px}.ind3{padding-left:66px}.ind4{padding-left:88px}
.more{padding:8px 12px;font-size:12.5px;color:var(--accent);font-weight:500}
.pct{color:var(--muted);font-size:11.5px;margin-left:6px}
.bar{display:inline-block;height:6px;border-radius:3px;background:var(--accent);vertical-align:middle;margin-right:8px;opacity:.75}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px}
.toolbar input[type=search]{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);min-width:260px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills button{padding:5px 11px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;color:var(--muted);background:var(--surface)}
.pills button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}
.heat{background:rgba(var(--heat),calc(var(--h) * .28))}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--surface2);color:var(--muted);margin-left:6px;vertical-align:1px}
.check{margin-top:10px;font-size:12.5px;color:var(--muted)}
.check .ok{color:var(--pos);font-weight:500}
.check .bad{color:var(--neg);font-weight:500}
.mt{margin-top:18px}
.toolbar input[type=date]{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.toolbar .fl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.toolbar button.reset{font-size:12.5px;color:var(--accent);padding:5px 8px}
.st{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;font-weight:500;white-space:nowrap}
.st.ok{background:var(--pos-soft);color:var(--pos)}
.st.diff{background:var(--amber-soft);color:var(--amber)}
.st.no_oris{background:var(--neg-soft);color:var(--neg)}
.st.no_rs{background:var(--accent-soft);color:var(--accent)}
.st.late{background:var(--surface2);color:var(--muted)}
.ledger tr.cur td{background:var(--accent-soft)}
footer{max-width:1380px;margin:0 auto;padding:0 28px 40px;color:var(--faint);font-size:12px}
@media (prefers-reduced-motion:no-preference){.chart rect,.chart circle{transition:opacity .15s}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1 id="h-title"></h1>
      <div class="sub" id="h-sub"></div>
    </div>
    <div class="controls">
      <span class="ctl-label" id="l-year"></span><div class="seg" id="years"></div>
      <span class="ctl-label" id="l-month"></span><select id="month"></select>
      <div class="seg lang" id="lang"><button data-l="ka">ქარ</button><button data-l="en">EN</button></div>
      <div class="seg theme" id="theme"><button data-th="light" aria-label="light">☀</button><button data-th="dark" aria-label="dark">☾</button></div>
    </div>
  </div>
  <nav class="tabs" role="tablist" id="tabs">
    <div class="tab-row-wrap">
      <span class="tab-row-label" data-rl="general"></span>
      <div class="tab-row">
        <button role="tab" data-p="ov"></button>
        <button role="tab" data-p="mp"></button>
      </div>
    </div>
    <div class="tab-row-wrap" data-budget-group="1">
      <span class="tab-row-label" data-rl="budgets"></span>
      <div class="tab-row">
        <button role="tab" data-p="pb"></button>
        <button role="tab" data-p="bb"></button>
        <button role="tab" data-p="cfb"></button>
        <button role="tab" data-p="pob"></button>
        <button role="tab" data-p="asb"></button>
      </div>
    </div>
    <div class="tab-row-wrap">
      <span class="tab-row-label" data-rl="statements"></span>
      <div class="tab-row">
        <button role="tab" data-p="pl"></button>
        <button role="tab" data-p="bs"></button>
        <button role="tab" data-p="cf"></button>
      </div>
    </div>
    <div class="tab-row-wrap" data-budget-group="1">
      <span class="tab-row-label" data-rl="avb"></span>
      <div class="tab-row">
        <button role="tab" data-p="avpl"></button>
        <button role="tab" data-p="avbs"></button>
        <button role="tab" data-p="avcf"></button>
        <button role="tab" data-p="avpf"></button>
        <button role="tab" data-p="avas"></button>
      </div>
    </div>
  </nav>
</header>

<main>
  <section class="panel" id="p-ov"></section>
  <section class="panel" id="p-mp"></section>
  <section class="panel" id="p-pb"></section>
  <section class="panel" id="p-bb"></section>
  <section class="panel" id="p-cfb"></section>
  <section class="panel" id="p-pob"></section>
  <section class="panel" id="p-asb"></section>
  <section class="panel" id="p-bs"></section>
  <section class="panel" id="p-pl"></section>
  <section class="panel" id="p-cf"></section>
  <section class="panel" id="p-avpl"></section>
  <section class="panel" id="p-avbs"></section>
  <section class="panel" id="p-avcf"></section>
  <section class="panel" id="p-avpf"></section>
  <section class="panel" id="p-avas"></section>
</main>
<footer id="foot"></footer>
<div class="tip" id="tip"></div>

<script>
const D = __DATA__;
const BUDGET = __BUDGET__;   // 2026 P&L/BS budget, extracted from the finance team's Excel model (null if not built)
const MAPPING = __MAPPING__; // Oris account -> CF category reference, from the finance team's own tagging (null if not built)
const M = D.months, NM = M.length;
const years = [...new Set(M.map(m=>m.slice(0,4)))];
const state = { year: years[years.length-1], month: null, tab: 'ov', lang: 'ka', open: new Set(), arLedger: '1 4 10', arQ: '', arN: 100, compactTabs: new Set(), theme: null, exOpenCell: new Map(), drillN: 40, drillSort: 'date', mpQ: '', mpN: 150, mpCat: '', mpSubcat: '', mpSubsub: '', mpInout: '', mpStatus: '', mpStmt: '', mpPl: '', mpBs: '', mpCf: '' };
try{ const l=localStorage.getItem('volta-fin-lang'); if(l==='en'||l==='ka') state.lang=l; }catch(_){}
try{ const th=localStorage.getItem('volta-fin-theme'); if(th==='light'||th==='dark'){ state.theme=th; document.documentElement.dataset.theme=th; } }catch(_){}

/* ---------- i18n ---------- */
const L = {
ka:{
  title:'შპს ვოლტა · ფინანსური ანგარიშგება', src:'წყარო: ორისი, ბაზის ასლი', journal:'ჟურნალი', allGel:'ყველა თანხა ლარში (₾)',
  year:'წელი', month:'თვე', wholeYear:'მთელი წელი',
  tabs:{ov:'მიმოხილვა',bs:'ბალანსი',pl:'მოგება-ზარალი',tb:'ბრუნვითი უწყისი',cf:'ფულადი ნაკადები',ar:'დებიტორები · კრედიტორები',ex:'ხარჯების ანალიზი',mp:'ანგარიშთა მეფინგი',pb:'PL Budget',bb:'BS Budget',cfb:'CF Budget',pob:'Portfolio Budget',asb:'Assumptions Budget',avpl:'PL Actual vs Budget',avbs:'BS Actual vs Budget',avcf:'CF Actual vs Budget',avpf:'Portfolio Actual vs Budget',avas:'Assumptions Actual vs Budget'},
  tabGroups:{general:'ზოგადი',budgets:'ბიუჯეტები',statements:'ანგარიშგებები',avb:'ფაქტი vs ბიუჯეტი'},
  compactAll:'მხოლოდ მთავარი მუხლები', expandAll:'ყველა მუხლი',
  actual:'ფაქტი', budget:'ბიუჯეტი', diff:'სხვაობა', ytd:'დაგროვილი',
  avTitlePL:'მოგება-ზარალი: ფაქტი vs ბიუჯეტი', avTitleBS:'ბალანსი: ფაქტი vs ბიუჯეტი', avTitleCF:'ფულადი ნაკადები: ფაქტი vs ბიუჯეტი',
  avNotePL:'ფაქტი ორისიდან ცოცხლად ითვლება და ბიუჯეტის ფაილის სტრუქტურას მისდევს: „სხვა შემოსავალი“ (87) არის მომსახურების, ჯარიმებისა და პორტფელის გაყიდვის (84–86) ჯამი, EBITDA = მთლიანი მოგება − ოპექსი + 84–86; მარჟები ითვლება შემოსავლიდან დღგ-ს გარეშე (79). ოპექსის ანგარიშები მუხლებზე მათი შინაარსით არის მიბმული (გადამოწმებულია Excel-ის იანვარ–ივლისის ფაქტთან): ხელფასები — „შრომის ანაზღაურება“ (7 4 10), სოციალური დანარიცხები (7 4 15) და საკონსულტაციო (7 4 50); ისინი იყოფა „პარტნიორების ხელფასად“ (დირექტორების 4 სახელფასო ანგარიში და 3 1 10 1684) და „სხვა პერსონალის ხელფასად“ — იანვარ–თებერვალში ხელფასი საერთო ანგარიშზე (3 1 30) იყო დარიცხული, ამიტომ ამ თვეებში პარტნიორების ხელფასი 0-ია და ყველაფერი „სხვა პერსონალშია“ (Excel-ში პარტნიორების ხელფასი ≈64 ათასი ₾ ფიქსირებული რიცხვია, ორისიდან ვერ გამეორდება); მენეჯმენტის საკომისიო (7 4 90 49), ოფისის ქირა (7 4 20) და კორპორატიული ღონისძიება (7 4 90 44) Excel-ს ზუსტად ემთხვევა; ცვეთა (7 4 55) გადავიდა არასაოპერაციო ბლოკში, როგორც Excel-ში; მიწოდება = 7 3 + საკურიერო, სატრანსპორტო და ავტომობილის ხარჯები; მარკეტინგი = მარკეტინგის ხარჯები + სარეკლამო მომსახურება (7 4 90 10) + სხვა საკონსულტაციო (7 4 56); „საოფისე ხარჯები“ (95) არის ყველა დანარჩენი 7 4 ანგარიში (საოფისე, კომუნიკაცია, ბანკის ხარჯი, ფიზიკური პირების მომსახურება…), ამიტომ ოპექსში არაფერი რჩება მუხლის გარეშე. სესხის პროცენტი (8 2 10) კრედიტორის ანგარიშით იყოფა 111/112/113-ზე; საპროცენტო შემოსავალი (8 1 10) აკლდება საბანკო პროცენტს; განსაკუთრებული ხარჯი (9 1/9 2 — მოთხოვნების ჩამოწერა 16.01.2026 ხელშეკრულებებით) არის „საეჭვო მოთხოვნების რეზერვში“ (102) — Excel-ის რეზერვი (~25–46 ათასი ₾/თვე) მოდელის შეფასებაა და ორისში ცალკე არ არის; ქვეიჯარის შემოსავალი (6 1 90 2) აკლდება კომუნალურს (99); დანარჩენი 8 1/8 2 ნეტოდ და 7 4 18 არის „გაუთვალისწინებელში“ (104). კურსთა სხვაობა (8 2 50 / 8 1 50) და ავტომობილის რეალიზაცია (8 1 90 1 / 8 2 90 1) სახელით მიბმულია 115/116-ზე და 110-ზე. წმინდა მოგება უცვლელია და ზუსტად უდგება დანარჩენ ტაბებს (შეუსაბამებელი ნაშთი, თუ მომავალში გაჩნდება, 104-ში აისახება). „მარკეტინგის ხელფასები“ (101) და დივიდენდები (117) ორისში ცალკე ჩანაწერად არ იძებნება. შემოსავალი/თვითღირებულება დღგ-ს ჩათვლით (78/80) x1.18-ია. სხვაობის % ბიუჯეტთან შედარებით.',
  avNoteBS:'ფაქტი ორისის ბალანსის ანგარიშებიდან, იმავე ლოგიკით რაც ბალანსის ტაბზეა. გრძელვადიანი სესხები ორისში ერთ ანგარიშზეა თავმოყრილი (4 1 90) კონტრაგენტის მიხედვით — ბანკის/ზუკის/პარტნიორის სესხები დაშლილია კონკრეტული კონტრაგენტის კოდების მიხედვით, გადამოწმებული იანვრის ბიუჯეტთან (სხვაობა 1-14%). „მოთხოვნების კორექტირება" (127) და „საპენსიო შენატანი" (145) ორისში შესატყვისი ანგარიში არ არსებობს.',
  avNoteCF:'ფაქტობრივი მონაცემი ისევ ცოცხლად, პირდაპირ ორისიდან არის გამოთვლილი — არა Excel-იდან კოპირებული. მეთოდი: ფინანსური გუნდის საკუთარ ფაილში („Badget VS Acctual Jul\'2026.xlsx") აღმოვაჩინე დამალული შიტი „Oris" — 122,841-სტრიქონიანი ორისის სრული ექსპორტი, სადაც მათ თვითონ აქვთ თითოეულ გატარებას მინიჭებული საკუთარი კატეგორია (რითაც აგებულია მათი CF\'Jul\'2026 მოდელი). ეს მონიშვნა ცოცხალი არ არის (ერთჯერადი სნეპშოტია, ივლისში ჩერდება), მაგრამ კონტრ-ანგარიშის კოდის მიხედვით დაჯგუფებით გამოვიდა გამძლე მეფინგი: ანგარიშის კოდი → კატეგორია. გადამოწმდა პირდაპირ — ამ მეფინგით ორისიდან ხელახლა გამოვთვალე იანვარი-ივლისის ფაქტი და შევადარე მათსავე მოდელს: თითქმის ყველა მუხლი ემთხვევა 0-3%-ის სიზუსტით (რამდენიმე — მენეჯმენტის საკომისიო, ოფისის ქირა, კორპორატიული ღონისძიება, ორივე საპროცენტო მუხლი, სამივე სესხის აღების მუხლი — ზუსტად ემთხვევა). ეს ასევე ორ ადრინდელ შეცდომას ასწორებს: „4 1 90 8019" (Claret Horizon Holdings) ფინანსური გუნდის მონაცემით ზუკის სესხია, არა პარტნიორის; „4 1 90 11677" (Finhub Georgia) ცალკე „სესხი ფინჰაბზე" კატეგორიაა, არა პარტნიორის სესხი — ორივე ადრე არასწორად იყო კლასიფიცირებული ანგარიშის სახელით (არა გამოყენებით). ასევე გასწორდა ადრინდელი მცდარი დასკვნა, რომ საინვესტიციო საქმიანობა ნულია მთელი წლის განმავლობაში — რეალურად არის (სისტემის განვითარება, ავტომობილის შესყიდვა), უბრალოდ ჩვეულებრივი მომწოდებლის ანგარიშის გავლით გატარდება, არა ცალკე ინვესტიციის ანგარიშით. რადგან ეს ცოცხალი ანგარიშის-კოდის მეფინგია (არა კოპირებული რიცხვი), ავტომატურად ფარავს ყველა თვეს, რაც ორისშია — აგვისტო/სექტემბერი აღარ არის „–". 2026-09-18: ეს მეფინგი შედარებული და გავრცობილია ფინანსური გუნდის ახალი, უფრო ახალი ფაილით — დაემატა Cogs/Marketing/Delivery-ის რამდენიმე გამოტოვებული ანგარიში (თითოეული ცალკე გადამოწმებული იანვარი-ივლისის ფაქტთან, გაუმჯობესებას თუ არა ამოწმებდა), და აღმოჩნდა „პარტნიორის კაპიტალის პროცენტის" ორი რეალური ანგარიშიც (გიორგი ზავრაშვილი ახალი და ჯორჯინა ფროფერთის სესხების პროცენტი) — თუმცა მათზე პროცენტის დარიცხვა მხოლოდ აგვისტოში დაიწყო, ასე რომ იანვარი-ივლისში ეს მუხლი კვლავ სამართლიანად ნულს/„–"-ს აჩვენებდა. პარტნიორთა ხელფასი (35/36): ორისის მონაცემებში (71 თანამშრომლის სახელფასო ანგარიშები) ვერსად მოიძებნა, თუ ვინ არის პარტნიორი — ყველა უბრალოდ „ხელფასია" მონიშნული. მომხმარებელმა თავად დაადასტურა (2026-09-18), რომ პარტნიორის ანაზღაურება საერთოდ არ გადის სახელფასო ანგარიშის გავლით — მიდის ცალკე, „შპს ვივო თრეიდის" (ანგარიში 3 1 10 1684) ანგარიშ-ფაქტურით, „საკონსულტაციო მომსახურების" სახით — ეს ახლა „პარტნიორთა ხელფასი"-ს ცოცხალი წყაროა, ხოლო „სხვა პერსონალის ხელფასი" ითვლის სრულ 71-კაციან სახელფასო ანგარიშს (რადგან სხვა ვერცერთი ცალკე პარტნიორი ვერ იდენტიფიცირდა სახელფასო სისტემაში). რაც კვლავ „–"-ითაა და რატომ: შემოსავალი (მომსახურება/ჯარიმა/პორტფელი/ძირითადი თანხა/ავანსი) — კლიენტის ანგარიში ერთდროულად რამდენიმე ტიპის შემოსავალს შეიცავს, ანგარიშის დონეზე ვერ იყოფა. დღგ, გიორგის ქონებით სესხის უზრუნველყოფა, გაუთვალისწინებელი ხარჯები — შესაბამისი ანგარიში არ იძებნება. გამყიდველების საოფისე ინვენტარი (Capex) — შემოწმებით, მხოლოდ ~37%-ია აღდგენადი (ბევრი მომწოდებელი ერთდროულად სხვა კატეგორიასაც ფარავს) — არასრული რიცხვის ჩვენება მცდარი შთაბეჭდილების მომტანი იქნებოდა, ამიტომ „–"-ადაა დატოვებული. დაწვრილება: ნებისმიერ არანულოვან უჯრაზე დაჭერით ჩანს ის გატარებები, რომლებისგანაც შედგება. ოპერაციული ნაკადების (26, 27, 33) ჯამი ნაშთებიდან გამოიანგარიშება (ნაშთის ცვლილება მინუს ფინანსური და საინვესტიციო), ამიტომ ჩამოთვლილი გატარებები მცირედ (რამდენიმე ათასი ₾-მდე) შეიძლება განსხვავდებოდეს — ამას პანელი წითლად აჩვენებს (ვალუტის დღიური კურსების სხვაობა). ფინჰაბის (Finhub Georgia) ნაკადები ერთხელ, სუფთა ნაშთით (გაცემული − დაბრუნებული) აისახება „Loan to Finhub“ სტრიქონში, ისევე როგორც ფინანსური გუნდის მოდელში; 2026-09-21-მდე ის ფინანსური ნაკადების ჯამებში ორჯერ ითვლებოდა (ივლისში 50 000 ₾). ხელფასების სტრიქონები (35/36) ახლა ფინანსური გუნდის Excel-ის მიხედვითაა: „სხვა პერსონალის ხელფასში“ შედის მთელი სახელფასო გადახდა — თანამშრომლების ანგარიშები (3 1 32), გადასახდელი ხელფასები (3 1 30, იანვარ-თებერვალში ხელფასი ამ ანგარიშით გადიოდა), სოციალური გადასახადი (3 3 70), დაზღვევა და ერთიანი საგადასახადო ანგარიში (3 3 20 1); „პარტნიორების ხელფასი“ კვლავ 3 1 10 1684-ია. Excel-ში იანვარ-აპრილში ერთიანი საგადასახადო ანგარიშიდან დღგ-ს გადახდა (36 990 / 47 899 / 49 300 / 67 548 ₾) ხელით არის გამოყოფილი, ანგარიშის წესით ეს ვერ გამეორდება, ამიტომ ამ თვეებში ხელფასი იმდენით მეტია; მაისი-ივნისი Excel-ს ±5 ათასით უახლოვდება. ახალი კაპექსის სტრიქონი 59 (ოფისის აღჭურვილობა) მხოლოდ იმ ანგარიშებს იჭერს, რომლებიც Excel-ში ამ ჭდეს ატარებს.',

  avNotePL:'Actual is computed live from Oris and follows the budget file\'s structure: \'Other Revenue\' (87) is the subtotal of services, penalty and portfolio sales (84-86); EBITDA = gross profit - Opex + 84-86; margins are relative to Revenue W/O VAT (79). Opex accounts are tied to budget lines by their meaning (checked against the Excel actuals for Jan-Jul): salaries are \'Labor compensation\' (7 4 10), social accruals (7 4 15) and consultancy (7 4 50), split into \'Salary of Shareholders\' (the four directors\' payroll accounts and 3 1 10 1684) and \'Salary of Other Staff\' - in Jan-Feb salaries were accrued to the generic 3 1 30 account, so Shareholders\' salary is 0 there and everything sits in Other Staff (the Excel\'s ~64k shareholder figure is a flat number that Oris cannot reproduce); Management Fee (7 4 90 49), Office Rent (7 4 20) and Corporate Party (7 4 90 44) match the Excel to the cent; depreciation (7 4 55) moved to the non-operating block like in the Excel; Delivery = 7 3 + courier, transport and vehicle costs; Marketing = marketing expenses + advertising services (7 4 90 10) + other consulting (7 4 56); \'Office Expenses\' (95) is every other 7 4 account (office, communication, bank fees, services by individuals...), so nothing in Opex is left without a budget line. Loan interest (8 2 10) is split by lender account into 111/112/113; interest income (8 1 10) reduces Bank Interest; extraordinary expense (9 1/9 2 - receivables written off on contracts dated 16.01.2026) is in Provision (102) - the Excel\'s provision (~25-46k/month) is a model estimate that does not exist in Oris; sublease income (6 1 90 2) reduces Utility (99); the remaining 8 1/8 2, net, and 7 4 18 are in Unpredictable (104). FX difference (8 2 50 / 8 1 50) and the car sale (8 1 90 1 / 8 2 90 1) are tied by name to 115/116 and 110. Net profit is unchanged and still ties exactly to the other tabs (any unclassified balance that may appear in the future is carried in 104). \'Marketing Salaries\' (101) and dividends (117) have no isolable Oris line. Revenue/Cogs incl. VAT (78/80) are x1.18. Diff % is relative to the budget.',
  avNoteBS:'Actual is from Oris\'s own balance-sheet accounts, same logic as the Balance Sheet tab. Long-term loans all sit in one Oris account (4 1 90) split only by contragent - Bank/Zuk/Shareholder loans are separated by the specific contragent codes that name them, checked against the January budget (1-14% variance). "Provision" (127, the receivables allowance) and "Pension Contribution" (145) have no matching Oris account.',
  avNoteCF:'Actuals are computed LIVE from Oris again - not copied from Excel. Method: a hidden sheet ("Oris") inside the finance team\'s own workbook ("Badget VS Acctual Jul\'2026.xlsx") turned out to be a 122,841-row raw Oris export where THEY had tagged every cash-flow transaction with their own category, the same tagging their CF\'Jul\'2026 model is built from. That tagging isn\'t live (a one-time snapshot, stops at July), but grouping it by counter-account code produced a durable account-code-to-category map. Validated directly: recomputing January-July actuals from live Oris data with this map and comparing to the finance team\'s own model matched to within 0-3% for nearly every category (several - Management Fee, Office Rent, Corporate Party, both interest splits, all three loan-draw categories - matched exactly). This also corrected two earlier mistakes: \'4 1 90 8019\' ("Claret Horizon Holdings") is tagged Zuk by the finance team, not Shareholder; \'4 1 90 11677\' ("Finhub Georgia") is its own "Loan To Finhub" category, not a shareholder loan - both were misclassified before, by account NAME rather than actual usage. It also overturned an earlier wrong finding that Investing activity was zero all year - it isn\'t (real System Development and vehicle capex exist), it just routes through the ordinary supplier-payable ledger instead of a dedicated investing account. Because this is a live account mapping, not a copied number, it automatically covers every month Oris has data for - August/September are no longer "–". 2026-09-18: this mapping was compared against a newer file the finance team supplied and extended - a handful of missed Cogs/Marketing/Delivery accounts were added (each individually checked against the January-July actual, confirmed to help before keeping), and two real accounts for "Interest of Shareholder\'s Equity" turned up (the interest on the Giorgi Zavrashvili-akhali and Georgina Properties shareholder loans) - but interest on those only started accruing in August, so this row still correctly showed zero/"–" for January-July either way. Salary of Shareholders/Other Staff (35/36): no payroll account (71 employees) distinguishes a shareholder from staff - every one is tagged just "Salary." The user confirmed directly (2026-09-18) that shareholder compensation doesn\'t run through payroll at all - it\'s paid separately, through "შპს ვივო თრეიდი" (account 3 1 10 1684), invoiced as "consulting services," and that the plain-"Salary"-tagged accounts are all Other Staff. That vendor account is now the live source for row 35, and row 36 sums the full 71-account payroll ledger. What\'s still "–" and why: Revenue (Services/Penalty/Portfolio/Principal/Advance) - a customer\'s account mixes every revenue type, can\'t be split by account alone. VAT, Securing a Loan with Giorgi\'s Property, Unpredictable Expenses - no matching account found. Salesman Office Equipment Capex - checked directly, only ~37% of real spend is traceable this way (too many vendors also cover other categories) - showing that partial figure would be misleading, so it stays "–". Drill-down: click any non-zero cell to see the postings it is made of. The Operating totals (26, 27, 33) are derived from balances (cash change minus Financing and Investing), so the listed postings can differ slightly (up to a few thousand ₾) - the panel shows that difference in red (daily FX-rate timing between the two legs of a transfer). Finhub Georgia flows are reported once, netted (lent - repaid) in the \'Loan to Finhub\' line, as in the finance team\'s model; until 2026-09-21 they were counted twice in the Financing totals (Jul 2026 by 50,000). The salary rows (35/36) now follow the finance team\'s Excel: \'Salary of Other Staff\' takes the WHOLE payroll cash-out - employee accounts (3 1 32), salary payable (3 1 30; January-February salaries went through it), social tax (3 3 70), staff insurance and the unified tax account (3 3 20 1); \'Salary of Shareholders\' stays 3 1 10 1684. In January-April the Excel splits VAT paid out of the unified tax account by hand (36,990 / 47,899 / 49,300 / 67,548), which no account rule can reproduce, so salary is higher by that amount in those months; May-June are within about 5k of the Excel. The new capex row 59 (office equipment) only catches the accounts the Excel tags that way.',

  avNotePF:'"Portfolio at Start of Month" and "Remaining Portfolio" actuals are approximated from Oris\'s total customer-receivables balance (account 1 4 10) — this doesn\'t exactly match the loan portfolio\'s own definition (principal only, excluding accrued fees/penalties), so part of the variance against budget may reflect a definitional difference rather than real performance. "Total Collection", "CAC" and "Remaining Clients" are loan-system/marketing metrics that Oris\'s bookkeeping never records — no actual is shown for these three.',

for (const c of Object.keys(ACC)) { const p = parentOf(c); if (p!==null) (children[p] ||= []).push(c); }
for (const p in children) children[p].sort(cmpCode);
function parentOf(c){ const i=c.lastIndexOf(' '); return i<0?null:c.slice(0,i); }
function cmpCode(a,b){ const x=a.split(' '),y=b.split(' '); for(let i=0;i<Math.max(x.length,y.length);i++){ if(x[i]===undefined)return -1; if(y[i]===undefined)return 1; const nx=+x[i],ny=+y[i]; if(!isNaN(nx)&&!isNaN(ny)){ if(nx!==ny)return nx-ny; } else if(x[i]!==y[i]) return x[i]<y[i]?-1:1; } return 0; }
const name = c => (state.lang==='en' && ACC_EN[c]) ? ACC_EN[c] : (ACC[c]||[T().unknownAcc])[0];
const level = c => c.split(' ').length;

/* ---------- Drill-down: the journal postings behind any number ----------
   D.journal holds every 2026 posting once (dictionary-encoded); POSTINGS indexes it per account as
   [date, purpose, counter-account, signed amount] (debit +, credit -). collectPostings() adds the
   sub-accounts, so a parent row's postings are the union of its children's. */
const JR = D.journal;
const YEAR0 = M[0].slice(0,4);
const p2 = n => String(n).padStart(2,'0');
const jdate = md => `${YEAR0}-${p2(Math.floor(md/100))}-${p2(md%100)}`;
const POSTINGS = (()=>{ const idx={}; for(const [md,si,di,ki,amt] of JR.r){ const date=jdate(md), story=JR.s[si], d=JR.c[di], k=JR.c[ki];
  (idx[d]||(idx[d]=[])).push([date,story,k,amt]); (idx[k]||(idx[k]=[])).push([date,story,d,-amt]); } return idx; })();
const _postingsCache = new Map();
function collectPostings(code){
  if(_postingsCache.has(code)) return _postingsCache.get(code);
  let arr=(POSTINGS[code]||[]).slice();
  for(const c of (children[code]||[])) arr=arr.concat(collectPostings(c));
  _postingsCache.set(code,arr);
  return arr;
}

/* ---------- period ---------- */
function monthsOf(y){ const a=[]; M.forEach((m,i)=>{ if(m.slice(0,4)===y) a.push(i); }); return a; }
/* Full Jan-Dec column set for a year, for month-by-month comparison tables/charts.
   Months with no data yet get a virtual index (> any real one) so stats()'s existing "m < s -> opening"
   rule carries the last real balance forward unchanged, and "m <= e" flow sums stay correctly at 0 -
   no change needed to stats()/close()/bsVal() themselves. */
function yearMonths(y){ const out=[]; for(let mm=1; mm<=12; mm++){ const key=`${y}-${String(mm).padStart(2,'0')}`; const real=M.indexOf(key); out.push({idx: real>=0?real:(NM+mm), mm, real:real>=0}); } return out; }
const ymLabel = x => GM()[x.mm-1];
const ymLabelF = x => GMF()[x.mm-1];
const mName = i => GMF()[+M[i].slice(5)-1];
const yLbl = y => state.lang==='en' ? y : `${y} წელი`;
function period(){
  const ys = monthsOf(state.year);
  if (state.month===null){
    const s=ys[0], e=ys[ys.length-1];
    const py = String(+state.year-1); const lastMon=M[e].slice(5); const pys = monthsOf(py).filter(i=>M[i].slice(5)<=lastMon);
    const partial = pys.length && (ys.length<12 || pys.length<12);
    return { s, e, label: `${yLbl(state.year)} (${mName(s)} – ${mName(e)})`, kind:'year',
      cmp: pys.length? {s:pys[0], e:pys[pys.length-1], label: partial? `${py} (${mName(pys[0])} – ${mName(pys[pys.length-1])})` : yLbl(py)}:null,
      cmpBS: s>0? {e:s-1, label: state.lang==='en' ? `end of ${M[s-1].slice(0,4)} (${mName(s-1)})` : `${M[s-1].slice(0,4)} წლის ბოლო (${mName(s-1)})`}:null };
  }
  const idx = M.indexOf(`${state.year}-${state.month}`);
  const s=idx,e=idx; const mn=+state.month-1;
  const pyi = M.indexOf(`${+state.year-1}-${state.month}`);
  return { s,e,label:`${GMF()[mn]} ${state.year}`, kind:'month',
    cmp: pyi>=0? {s:pyi,e:pyi,label:`${GMF()[mn]} ${+state.year-1}`}:null,
    cmpBS: s>0? {e:s-1,label:`${mName(s-1)} ${M[s-1].slice(0,4)}`}:null };
}
function endLabel(e){ return `${mName(e)} ${M[e].slice(0,4)}`; }
const endOfLbl = e => state.lang==='en' ? `end of ${endLabel(e)}` : `${endLabel(e)} ბოლოს`;

/* ---------- stats ---------- */
const cache = new Map();
function stats(s,e){
  const key=s+':'+e; if(cache.has(key)) return cache.get(key);
  const st=new Map(); const get=c=>{ let v=st.get(c); if(!v){v={o:0,d:0,c:0}; st.set(c,v);} return v; };
  for (const code in D.agg){ const a=D.agg[code]; let o=0,d=0,c=0;
    for(let i=0;i<a.length;i+=3){ const m=a[i]; if(m<s) o+=a[i+1]-a[i+2]; else if(m<=e){ d+=a[i+1]; c+=a[i+2]; } }
    if(!o&&!d&&!c) continue;
    let p=code; while(p!==null){ const v=get(p); v.o+=o; v.d+=d; v.c+=c; p=parentOf(p); }
  }
  cache.set(key,st); return st;
}
const S = (st,c)=>st.get(c)||{o:0,d:0,c:0};
const close = v => v.o+v.d-v.c;
function plNet(st){ let o=0,n=0; for(const c of ['6','7','8','9']){ const v=S(st,c); o+=v.o; n+=v.d-v.c; } return {o,n}; }

/* ---------- formatting ---------- */
const NBSP=' ';
function fmt(n,dec=2){ if(n===null||n===undefined||isNaN(n)) return '–'; const neg=n<-0.004; const a=Math.abs(n).toFixed(dec); const [i,f]=a.split('.'); const g=i.replace(/\B(?=(\d{3})+(?!\d))/g,NBSP); return (neg?'−':'')+g+(f?'.'+f:''); }
function fmtK(n){ const a=Math.abs(n); if(a>=1e6) return (n<0?'−':'')+(a/1e6).toFixed(2)+NBSP+T().mln; if(a>=1e4) return (n<0?'−':'')+(a/1e3).toFixed(1)+NBSP+T().ths; return fmt(n,0); }
function cell(n,opts={}){ const cls=['n']; if(Math.abs(n)<0.005) cls.push('zero'); else if(n<0) cls.push('neg'); else if(opts.pos) cls.push('pos');
  let attr=''; if(opts.drill && Math.abs(n)>=0.005){ const [sc,key,f,t]=opts.drill; cls.push('clickable'); if(state.exOpenCell.get(sc+'|'+key)===f+'|'+t) cls.push('cell-open'); attr=` data-cellpost="${esc(sc)}|${esc(key)}|${f}|${t}"`; }
  return `<td class="${cls.join(' ')}"${attr}>${fmt(n)}</td>`; }
function delta(cur,prev,invert){ if(prev===null||prev===undefined||Math.abs(prev)<0.005) return `<span>${T().prev}: –</span>`; const d=cur-prev; const p=d/Math.abs(prev)*100; const good=invert?d<0:d>0; return `<span class="${Math.abs(p)<0.05?'':(good?'up':'dn')}">${d>=0?'+':'−'}${fmt(Math.abs(d),0)} (${p>=0?'+':'−'}${Math.abs(p).toFixed(1)}%)</span>`; }
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function periodHead(title, sub, extra){ return `<div class="period"><h2>${title}</h2><span class="win">${sub}</span>${extra||''}</div>`; }
function compactBtn(id){ const t=T(); const on=state.compactTabs.has(id); return `<button class="compact-btn" data-compact="${id}" aria-pressed="${on}">${on?t.expandAll:t.compactAll}</button>`; }
const gel = `<span style="font-size:13px;color:var(--muted)"> ₾</span>`;

/* ---------- generic tree table ---------- */
function treeRows(roots, st, opts){
  const out=[]; const maxL=opts.maxLevel||5;
  const walk=(code,lv)=>{
    const kids=(children[code]||[]).filter(k=>opts.keep? opts.keep(k,st):true);
    const has=kids.length>0 && lv<maxL;
    const id=opts.prefix+code;
    const isOpen = state.open.has(id) || (lv<= (opts.openTo||1));
    out.push(opts.row(code,lv,has,isOpen,id));
    if(has && isOpen){
      let list=kids;
      if(kids.length>150){ list=kids.slice().sort((a,b)=>Math.abs(opts.sortVal(b,st))-Math.abs(opts.sortVal(a,st))).slice(0,150); }
      for(const k of list) walk(k,lv+1);
      if(kids.length>150) out.push(`<tr><td colspan="9" class="more ind${Math.min(lv,4)}">${T().shownTop(150,kids.length)}</td></tr>`);
    }
  };
  for(const r of roots) walk(r,1);
  return out.join('');
}
function tgl(has,open,id){ return has? `<button class="tg ${open?'open':''}" data-tg="${id}" aria-label="${open?T().collapse:T().expand}">${open?'−':'+'}</button>` : `<span class="tg none"></span>`; }
function nameCell(code,lv,has,open,id,label){ return `<td class="name ind${Math.min(lv-1,4)}">${tgl(has,open,id)}<span class="code">${esc(code)}</span>${esc(label||name(code))}</td>`; }

/* ---------- charts ---------- */
const tip=document.getElementById('tip');
function showTip(ev,html){ tip.innerHTML=html; tip.style.display='block'; const r=ev.currentTarget.closest('.chart').getBoundingClientRect(); tip.style.left=(ev.clientX-r.left)+'px'; tip.style.top=(ev.clientY-r.top-8)+'px'; }
function hideTip(){ tip.style.display='none'; }
function niceMax(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); const f=v/p; const n= f<=1?1: f<=2?2: f<=2.5?2.5: f<=5?5:10; return n*p; }
function attachTips(el){ el.querySelectorAll('rect[data-tt]').forEach(r=>{ r.addEventListener('mousemove',ev=>showTip(ev,r.dataset.tt)); r.addEventListener('mouseleave',hideTip); }); }
function barChart(el, labels, series, line){
  const W=820,H=250,Lm=58,R=12,Tm=14,B=30; const iw=W-Lm-R, ih=H-Tm-B;
  let mx=0,mn=0; series.forEach(s=>s.vals.forEach(v=>{mx=Math.max(mx,v);mn=Math.min(mn,v);})); if(line) line.vals.forEach(v=>{mx=Math.max(mx,v);mn=Math.min(mn,v);});
  mx=niceMax(mx); mn= mn<0? -niceMax(-mn):0; const span=mx-mn||1;
  const y=v=>Tm+ih-(v-mn)/span*ih; const n=labels.length; const gw=iw/n; const bw=Math.max(4,(gw*0.7)/series.length-2);
  let g=''; for(let i=0;i<=5;i++){ const v=mn+span*i/5; const yy=y(v); g+=`<line x1="${Lm}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line2)" stroke-width="1"/><text x="${Lm-8}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${fmtK(v)}</text>`; }
  if(mn<0) g+=`<line x1="${Lm}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1"/>`;
  let bars='',hit='';
  labels.forEach((lb,i)=>{ const x0=Lm+i*gw+(gw-(bw+2)*series.length)/2;
    series.forEach((s,j)=>{ const v=s.vals[i]; const x=x0+j*(bw+2); const y0=y(0), y1=y(v); const top=Math.min(y0,y1), h=Math.abs(y0-y1);
      bars+=`<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,0).toFixed(1)}" rx="2" fill="${s.color}" stroke="var(--surface)" stroke-width="1"/>`; });
    g+=`<text x="${Lm+i*gw+gw/2}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)">${lb}</text>`;
    const tt=`<b>${lb}</b>`+series.map(s=>`<br>${s.name}: ${fmt(s.vals[i],0)} ₾`).join('')+(line?`<br>${line.name}: ${fmt(line.vals[i],0)} ₾`:'');
    hit+=`<rect x="${Lm+i*gw}" y="${Tm}" width="${gw}" height="${ih}" fill="transparent" data-tt="${esc(tt).replace(/"/g,'&quot;')}"/>`; });
  let ln='';
  if(line){ const pts=line.vals.map((v,i)=>`${(Lm+i*gw+gw/2).toFixed(1)},${y(v).toFixed(1)}`); ln=`<polyline points="${pts.join(' ')}" fill="none" stroke="${line.color}" stroke-width="2" stroke-linejoin="round"/>`+line.vals.map((v,i)=>`<circle cx="${(Lm+i*gw+gw/2).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.5" fill="${line.color}" stroke="var(--surface)" stroke-width="2"/>`).join(''); }
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img">${g}${bars}${ln}${hit}</svg>`; attachTips(el);
}
function lineChart(el, labels, series){
  const W=820,H=250,Lm=58,R=12,Tm=14,B=30; const iw=W-Lm-R, ih=H-Tm-B;
  let mx=0,mn=0; series.forEach(s=>s.vals.forEach(v=>{mx=Math.max(mx,v);mn=Math.min(mn,v);})); mx=niceMax(mx); mn=mn<0?-niceMax(-mn):0; const span=mx-mn||1;
  const n=labels.length; const x=i=>Lm+(n>1? i*iw/(n-1):iw/2); const y=v=>Tm+ih-(v-mn)/span*ih;
  let g=''; for(let i=0;i<=5;i++){ const v=mn+span*i/5; g+=`<line x1="${Lm}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line2)"/><text x="${Lm-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${fmtK(v)}</text>`; }
  labels.forEach((lb,i)=>{ g+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)">${lb}</text>`; });
  let paths='';
  series.forEach((s,j)=>{ const pts=s.vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`);
    if(j===0) paths+=`<path d="M${x(0).toFixed(1)},${y(0)} L${pts.join(' L')} L${x(n-1).toFixed(1)},${y(0)} Z" fill="${s.color}" opacity=".12"/>`;
    paths+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`;
    paths+=s.vals.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${i===n-1?4.5:3}" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`).join(''); });
  let hit=''; labels.forEach((lb,i)=>{ const tt=`<b>${lb}</b>`+series.map(s=>`<br>${s.name}: ${fmt(s.vals[i],0)} ₾`).join(''); const w=n>1?iw/(n-1):iw; hit+=`<rect x="${x(i)-w/2}" y="${Tm}" width="${w}" height="${ih}" fill="transparent" data-tt="${esc(tt).replace(/"/g,'&quot;')}"/>`; });
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img">${g}${paths}${hit}</svg>`; attachTips(el);
}
const cssVar=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* ---------- P&L model ---------- */
function plLines(st){
  const inc=c=>{const v=S(st,c); return v.c-v.d;}, exp=c=>{const v=S(st,c); return v.d-v.c;};
  const rev=inc('6'), cogs=exp('7 2')+exp('7 1'), gross=rev-cogs, dist=exp('7 3'), adm=exp('7 4'), op=gross-dist-adm;
  const noi=inc('8 1'), noe=exp('8 2'), ext=inc('9 1'), oth=exp('9 2'); const net=op+noi-noe+ext-oth;
  return {rev,cogs,gross,dist,adm,op,noi,noe,ext,oth,net};
}
function cashClose(st){ return close(S(st,'1 1'))+close(S(st,'1 2')); }
const kpi=(l,v,d)=>`<div class="kpi"><div class="l">${l}</div><div class="v num">${typeof v==='number'?fmt(v,0)+gel:v}</div><div class="d">${d||''}</div></div>`;

/* ---------- OVERVIEW ---------- */
function renderOV(){
  const t=T(); const P=period(); const st=stats(P.s,P.e); const cs=P.cmp?stats(P.cmp.s,P.cmp.e):null;
  const pl=plLines(st), pp=cs?plLines(cs):null;
  const ar=close(S(st,'1 4')), liab=-(close(S(st,'3'))+close(S(st,'4'))), cash=cashClose(st);
  const bsPrev=P.cmpBS?stats(P.cmpBS.e+1,P.cmpBS.e):null;
  const prevAR=bsPrev?S(bsPrev,'1 4').o:null, prevCash=bsPrev?(S(bsPrev,'1 1').o+S(bsPrev,'1 2').o):null, prevLiab=bsPrev?-(S(bsPrev,'3').o+S(bsPrev,'4').o):null;
  let h=periodHead(t.tabs.ov, `${t.period}: <b>${P.label}</b>${P.cmp?` · ${t.compare}: ${P.cmp.label}`:''}`);
  h+=`<div class="kpis">${kpi(t.revenue,pl.rev,pp&&delta(pl.rev,pp.rev))}${kpi(t.gross,pl.gross,pp&&delta(pl.gross,pp.gross))}${kpi(t.net,pl.net,pp&&delta(pl.net,pp.net))}${kpi(t.cash+' · '+endLabel(P.e),cash,prevCash!==null&&delta(cash,prevCash))}${kpi(t.ar,ar,prevAR!==null&&delta(ar,prevAR))}${kpi(t.liab,liab,prevLiab!==null&&delta(liab,prevLiab,true))}</div>`;
  const YM=yearMonths(state.year); const ys=YM.map(x=>x.idx); const labels=YM.map(ymLabel);
  const revV=[],netV=[],cashV=[],arV=[];
  ys.forEach(i=>{ const s1=stats(i,i); const p1=plLines(s1); revV.push(p1.rev); netV.push(p1.net); cashV.push(cashClose(s1)); arV.push(close(S(s1,'1 4'))); });
  h+=`<div class="grid2"><div class="card"><h3>${t.chRev}</h3><div class="cap">${yLbl(state.year)}, ₾</div><div class="legend"><span><i style="background:${cssVar('--accent')}"></i>${t.revenue}</span><span><i style="background:${cssVar('--amber')}"></i>${t.net}</span></div><div class="chart" id="c-rev"></div></div>
  <div class="card"><h3>${t.chCash}</h3><div class="cap">${yLbl(state.year)}, ${t.eomBal}, ₾</div><div class="legend"><span><i style="background:${cssVar('--accent')}"></i>${t.cashLeg}</span><span><i style="background:${cssVar('--amber')}"></i>${t.arLeg}</span></div><div class="chart" id="c-cash"></div></div></div>`;
  h+=`<div class="card mt"><h3>${t.yearly}</h3><div class="cap">${t.yearlyCap}</div><div class="tablewrap" style="box-shadow:none;border:0"><table class="ledger"><thead><tr><th>${t.year}</th><th class="n">${t.revenue}</th><th class="n">${t.gross}</th><th class="n">${t.margin}</th><th class="n">${t.adm}</th><th class="n">${t.net}</th><th class="n">${t.cashYE}</th><th class="n">${t.arShort}</th><th class="n">${t.liabShort}</th></tr></thead><tbody>`;
  for(const y of years){ const ym=monthsOf(y); const s1=stats(ym[0],ym[ym.length-1]); const p1=plLines(s1); h+=`<tr><td class="num">${y}${ym.length<12?`<span class="badge">${ym.length} ${t.months}</span>`:''}</td>${cell(p1.rev)}${cell(p1.gross)}<td class="n">${p1.rev?(p1.gross/p1.rev*100).toFixed(1)+'%':'–'}</td>${cell(p1.adm)}${cell(p1.net,{pos:true})}${cell(cashClose(s1))}${cell(close(S(s1,'1 4')))}${cell(-(close(S(s1,'3'))+close(S(s1,'4'))))}</tr>`; }
  h+=`</tbody></table></div></div>`;
  h+=`<div class="card mt"><h3>${t.monthlySum}</h3><div class="cap">${t.monthlyCap}</div><div class="tablewrap" style="box-shadow:none;border:0"><table class="ledger"><thead><tr><th>${t.month}</th><th class="n">${t.revenue}</th><th class="n">${t.gross}</th><th class="n">${t.margin}</th><th class="n">${t.adm}</th><th class="n">${t.net}</th><th class="n">${t.cashME}</th><th class="n">${t.arShort}</th><th class="n">${t.liabShort}</th></tr></thead><tbody>`;
  for(const x of YM){ const s1=stats(x.idx,x.idx); const p1=plLines(s1); h+=`<tr><td class="num" ${!x.real?'style="color:var(--faint)"':''}>${ymLabelF(x)}</td>${cell(p1.rev)}${cell(p1.gross)}<td class="n">${p1.rev?(p1.gross/p1.rev*100).toFixed(1)+'%':'–'}</td>${cell(p1.adm)}${cell(p1.net,{pos:true})}${cell(cashClose(s1))}${cell(close(S(s1,'1 4')))}${cell(-(close(S(s1,'3'))+close(S(s1,'4'))))}</tr>`; }
  h+=`</tbody></table></div></div>`;
  const el=document.getElementById('p-ov'); el.innerHTML=h;
  barChart(el.querySelector('#c-rev'),labels,[{name:t.revenue,color:cssVar('--accent'),vals:revV}],{name:t.net,color:cssVar('--amber'),vals:netV});
  lineChart(el.querySelector('#c-cash'),labels,[{name:t.cashLeg,color:cssVar('--accent'),vals:cashV},{name:t.arLeg,color:cssVar('--amber'),vals:arV}]);
}

/* ---------- BALANCE SHEET ---------- */
function bsVal(st,code){ const v=S(st,code); let x=close(v); if(code==='5'||code==='5 3'||code==='5 3 30'){ const p=plNet(st); x+=p.o+p.n; } const cls=code[0]; return (cls==='1'||cls==='2')? x : -x; }
function bsOpen(st,code){ const v=S(st,code); let x=v.o; if(code==='5'||code==='5 3'||code==='5 3 30'){ x+=plNet(st).o; } const cls=code[0]; return (cls==='1'||cls==='2')? x : -x; }
/* ---------- headline dashboards on top of the P&L and Balance Sheet statements ----------
   Same look as the Cash Flow tab (KPI cards + one monthly chart), built from the very same live numbers the
   budget-layout tables below use (PL_ACTUALS / BS_ACTUALS), so cards, chart and table always agree. */
const plSum=(row,s0,e0)=>{ let x=0; for(let j=s0;j<=e0;j++) x+=PL_ACTUALS[row](j); return x; };
function plDash(P){
  const t=T(); const rev=plSum(79,P.s,P.e), gp=plSum(82,P.s,P.e), opex=plSum(90,P.s,P.e), eb=plSum(105,P.s,P.e), np=plSum(118,P.s,P.e);
  const pc=v=>rev?`${(v/rev*100).toFixed(1)}% ${t.dOfRev}`:'';
  let h=`<div class="kpis">${kpi(t.dRevW,rev)}${kpi(t.gross,gp,pc(gp))}${kpi(t.dOpex,opex,pc(opex))}${kpi('EBITDA',eb,pc(eb))}${kpi(t.net,np,pc(np))}</div>`;

const bsAt=(row,j)=>{ if(j>=0) return BS_ACTUALS[row](j); const codes=row===154?['5']:AVBS_CODES[row]; return codes.reduce((s0,c)=>s0+bsOpen(stats(0,0),c),0); };

/* Statements in the finance team's own budget-file layout (line names/order from BUDGET.pl / BUDGET.bs),
   filled with LIVE Oris actuals - the same PL_ACTUALS / BS_ACTUALS the Actual-vs-Budget tabs use. Lines with
   no reliable Oris mapping show "-" (never guessed). Drill-down reuses the avpl/avbs scopes. */
function stmtTable(scope,rows,ACT,compactId,withTotal){
  const t=T(); const YM=yearMonths(state.year); const nc=YM.length+1+(withTotal?1:0);
  let h=`<table class="ledger"><thead><tr><th>${t.item}</th>${YM.map(x=>`<th class="n" ${!x.real?'style="color:var(--faint)"':''}>${ymLabel(x)}</th>`).join('')}${withTotal?`<th class="n">${t.total}</th>`:''}</tr></thead><tbody>`;
  for(const b of rows){ if(state.compactTabs.has(compactId)&&b.level===2) continue;
    const label=state.lang==='en'?(b.en||b.ka):b.ka; const cls=b.level===1?(b.bold?'total':'lvl1'):''; const ind=b.level===2?'ind1':'';
    if(b.pct){ h+=`<tr>${pctNameTd(b)}${YM.map(x=>x.real?avPctCell(pctActual(b,x.idx,x.idx)):cell(undefined)).join('')}${withTotal?avPctCell(pctActual(b,0,M.length-1)):''}</tr>`; continue; }
    const fn=ACT[b.row]; let tot=0;
    const tds=YM.map(x=>{ if(!fn||!x.real) return cell(undefined); const v=fn(x.idx); tot+=v; return cell(v,{drill:dr(scope,b.row,x.mm,x.mm)}); }).join('');
    h+=`<tr class="${cls}"><td class="name ${ind}">${esc(label)}</td>${tds}${withTotal?(fn?cell(tot,{drill:dr(scope,b.row,1,12)}):cell(undefined)):''}</tr>${drillPanel(scope,b.row,nc)}`; }
  return h+`</tbody></table>`;
}
function renderBS(){

/* ---------- P&L ---------- */
// Which branches of the chart of accounts are credit-normal ("income-shaped": 6, and the "1"
// sub-branch of the otherwise expense-shaped 8/9 non-operating classes). Shared by PL and TB so
// both show the same account the same way round - a stray "8"/"9" node with both income (8 1/9 1)
// and expense (8 2/9 2) children under it would net two different sign conventions into one
// meaningless number, so anything that walks this tree renders 8 1/8 2/9 1/9 2 as separate roots,
// never bare 8/9.
const incSign=c=>c[0]==='6'||c==='8 1'||c==='9 1'||c.startsWith('8 1 ')||c.startsWith('9 1 ');
function renderPL(){
  const t=T(); const P=period();
  const val=(s,c)=>{ const v=S(s,c); return incSign(c)? v.c-v.d : v.d-v.c; };
  let h=periodHead(t.plTitle, `${t.period}: <b>${P.label}</b>`);
  if(BUDGET) h+=plDash(P);
  const YM=yearMonths(state.year); const ys=YM.map(x=>x.idx);
  const mp=ys.map(j=>plLines(stats(j,j)));
  if(BUDGET){ h+=`<div class="card mt"><h3><span>${t.plTitle} · ${t.byMonth} · ${state.year}</span>${compactBtn('pl')}</h3><div class="cap">${t.exPos}</div><p class="note">${t.pClickHint}</p><div class="tablewrap" style="box-shadow:none;border:0">${stmtTable('avpl',plLayout(true),PL_ACTUALS,'pl',true)}</div></div><p class="note">${t.stmtBudgetNote}</p><p class="note">${t.plNote}</p>`; const plEl=document.getElementById('p-pl'); plEl.innerHTML=h; plDashDraw(plEl); return; }
  const monthlyVal=(code,j)=>val(stats(j,j),code);
  const mkeep=(k)=>ys.some(j=>Math.abs(monthlyVal(k,j))>0.004);
  const mrow=(code,lv,has,open,id)=>{ const l=lv<=2?`lvl${lv}`:''; const vals=ys.map(j=>monthlyVal(code,j)); return `<tr class="${l}">${nameCell(code,lv,has,open,id)}${vals.map((v,i)=>cell(v,{drill:YM[i].real?dr('plm',code,YM[i].mm,YM[i].mm):undefined})).join('')}${cell(vals.reduce((a,b)=>a+b,0),{drill:dr('plm',code,1,12)})}</tr>${drillPanel('plm',code,ys.length+2)}`; };
  const mopts={prefix:'plm',openTo:1,maxLevel:state.compactTabs.has('pl')?1:4,keep:mkeep,row:mrow,sortVal:(k)=>ys.reduce((s,j)=>s+Math.abs(monthlyVal(k,j)),0)};
  const msub=(label,arr,key)=>`<tr class="sub"><td>${label}</td>${arr.map((v,i)=>cell(v,{pos:true,drill:YM[i].real?dr('plm',key,YM[i].mm,YM[i].mm):undefined})).join('')}${cell(arr.reduce((a,b)=>a+b,0),{pos:true,drill:dr('plm',key,1,12)})}</tr>${drillPanel('plm',key,ys.length+2)}`;
  let hm=`<div class="card mt"><h3><span>${t.plTitle} · ${t.byMonth} · ${state.year}</span>${compactBtn('pl')}</h3><div class="cap">${t.exPos}</div><p class="note">${t.pClickHint}</p><div class="tablewrap" style="box-shadow:none;border:0"><table class="ledger"><thead><tr><th>${t.item}</th>${YM.map(x=>`<th class="n" ${!x.real?'style="color:var(--faint)"':''}>${ymLabel(x)}</th>`).join('')}<th class="n">${t.total}</th></tr></thead><tbody>`;
  hm+=`<tr class="head"><td colspan="${ys.length+2}">${t.opRev}</td></tr>${treeRows(['6'],null,mopts)}`;
  hm+=`<tr class="head"><td colspan="${ys.length+2}">${t.cogs}</td></tr>${treeRows(['7 2','7 1'],null,{...mopts,openTo:0})}`;
  hm+=msub(t.gross, mp.map(x=>x.gross),'GROSS');
  hm+=`<tr class="head"><td colspan="${ys.length+2}">${t.opEx}</td></tr>${treeRows(['7 3','7 4'],null,{...mopts,openTo:0})}`;
  hm+=msub(t.opProfit, mp.map(x=>x.op),'OP');
  hm+=`<tr class="head"><td colspan="${ys.length+2}">${t.nonOp}</td></tr>${treeRows(['8 1','8 2','9 1','9 2'],null,{...mopts,openTo:0})}`;
  hm+=`<tr class="total"><td>${t.netPL}</td>${mp.map((x,i)=>cell(x.net,{pos:true,drill:YM[i].real?dr('plm','NET',YM[i].mm,YM[i].mm):undefined})).join('')}${cell(mp.reduce((s,x)=>s+x.net,0),{pos:true,drill:dr('plm','NET',1,12)})}</tr>${drillPanel('plm','NET',ys.length+2)}`;
  hm+=`</tbody></table></div></div>`;
  h+=hm;
  h+=`<p class="note">${t.plNote}</p>`;
  document.getElementById('p-pl').innerHTML=h;
}

/* ---------- TRIAL BALANCE ---------- */
// Credit-normal branches (liabilities 3/4, equity 5, plus the income branches PL already flips)
// show as positive here too, matching how the P&L and Balance Sheet tabs already present the same
// underlying accounts - a raw debit-positive/credit-negative trial balance is technically valid
// bookkeeping, but was the only place on this dashboard where revenue read as negative and expense
// as positive, which is confusing next to every other tab (2026-09-18, fixed after a user report).
const tbSign=c=>(c[0]==='3'||c[0]==='4'||c[0]==='5'||incSign(c))?-1:1;
const tbVal=(s,c)=>tbSign(c)*close(S(s,c));
function renderTB(){

    const mopts={prefix:'tbm',openTo:1,maxLevel:state.compactTabs.has('tb')?1:4,keep:mkeep,row:mrow,sortVal:(k)=>tbVal(stats(ys[0],ys[ys.length-1]),k)};

    hm+=treeRows(['1','2','3','4','5','6','7','8 1','8 2','9 1','9 2'],null,mopts);

/* ---------- CASH FLOW ---------- */
const isCash=c=>c.startsWith('1 1')||c.startsWith('1 2');
// '1 6 35' ("შუალედური ანგარიში" / Intermediate account) is Oris's own internal clearing account
// used to sweep money between the company's bank accounts - checked directly (2026-09-18): 913 of
// 950 postings through it that year (99.97% of its 15.4M GEL volume) pair with a real cash account
// on the other leg, exactly like a same-account-to-account transfer. Left unfiltered, it inflated
// gross Inflow/Outflow (e.g. "Purchase of Goods and Materials" showed ~2x the real Jan figure,
// caught by cross-checking against the finance team's own reconciled model). Used only for the
// COUNTER-account side of a cash-flow entry, not for `isCash` itself (which lists real bank/till
// accounts as rows in the per-account cash table, and must NOT gain a fake "1 6 35" row).
const isCashCtr=c=>isCash(c)||c==='1 6 35';
function renderCF(){
  const t=T(); const P=period(); const st=stats(P.s,P.e);
  const byAcc=new Map(); let tin=0,tout=0,trIn=0,trOut=0;
  for(const [cash,ctr,m,i,o] of D.cf){ if(m<P.s||m>P.e) continue;
    const a=byAcc.get(cash)||{i:0,o:0,ti:0,to:0}; byAcc.set(cash,a);
    if(isCashCtr(ctr)){ a.ti+=i; a.to+=o; trIn+=i; trOut+=o; continue; }
    a.i+=i; a.o+=o; tin+=i; tout+=o; }
  const open=S(st,'1 1').o+S(st,'1 2').o, end=cashClose(st);
  let h=periodHead(t.cfTitle, `${t.period}: <b>${P.label}</b> · ${t.cfSub}`);
  h+=`<div class="kpis">${kpi(t.cashOpen,open)}${kpi(t.inflow,tin)}${kpi(t.outflow,tout)}${kpi(t.netFlow,end-open)}${kpi(t.cashEnd,end)}</div>`;
  const YM=yearMonths(state.year); const ys=YM.map(x=>x.idx); const labels=YM.map(ymLabel); const inV=ys.map(()=>0), outV=ys.map(()=>0);
  for(const [cash,ctr,m,i,o] of D.cf){ const j=ys.indexOf(m); if(j<0||isCashCtr(ctr)) continue; inV[j]+=i; outV[j]+=o; }
  h+=`<div class="card"><h3>${t.cfChart}</h3><div class="cap">${yLbl(state.year)}, ${t.cfChartCap}</div><div class="legend"><span><i style="background:${cssVar('--accent')}"></i>${t.inflow}</span><span><i style="background:${cssVar('--amber')}"></i>${t.outflow}</span></div><div class="chart" id="c-cf"></div></div>`;
  if(BUDGET && BUDGET.cf){
    const actN=D.months.length;
    let hm=`<div class="card mt"><h3>${t.cfTitle} · ${t.byMonth} · ${state.year}</h3><div class="cap">${t.cfByMonthCap}</div><p class="note">${t.pClickHint}</p><div class="tablewrap" style="box-shadow:none;border:0"><table class="ledger"><thead><tr><th>${t.item}</th>${YM.map((x,pos)=>`<th class="n" ${pos>=actN?'style="color:var(--faint)"':''}>${ymLabel(x)}</th>`).join('')}<th class="n">${t.total}</th></tr></thead><tbody>`;
    for(const b of BUDGET.cf){
      const label=state.lang==='en'?(b.en||b.ka):b.ka; const cls=b.level===1?(b.bold?'total':'lvl1'):''; const ind=b.level===2?'ind1':'';
      const fn=LIVE_CF_ACTUALS[b.row];
      const vals=YM.map((x,pos)=>(fn&&pos<actN)?fn(pos):undefined);
      const tot=fn?vals.slice(0,actN).reduce((s,v)=>s+v,0):undefined;
      hm+=`<tr class="${cls}"><td class="name ${ind}">${esc(label)}</td>${vals.map((v,i)=>cell(v,{drill:(v!==undefined&&YM[i].real)?dr('cf',b.row,YM[i].mm,YM[i].mm):undefined})).join('')}${cell(tot,{drill:tot!==undefined?dr('cf',b.row,1,12):undefined})}</tr>${drillPanel('cf',b.row,YM.length+2)}`;
    }
    hm+=`</tbody></table></div><p class="note">${t.cfByMonthNote}</p></div>`;
    h+=hm;
  }
  const el=document.getElementById('p-cf'); el.innerHTML=h;
  barChart(el.querySelector('#c-cf'),labels,[{name:t.inflow,color:cssVar('--accent'),vals:inV},{name:t.outflow,color:cssVar('--amber'),vals:outV}],null);
}

/* ---------- AR / AP ---------- */
const AR_LEDGERS=['1 4 10','3 1 20','3 1 10','3 1 31','3 1 32','4 1 90','3 2 10','1 4 30','1 4 50'];
function renderAR(){
  const t=T(); const P=period(); const st=stats(P.s,P.e); const led=state.arLedger; const isA=led[0]==='1'; const sign=isA?1:-1;
  let rows=(children[led]||[]).map(c=>{ const v=S(st,c); return {c,o:v.o*sign,d:v.d,k:v.c,e:close(v)*sign}; }).filter(r=>Math.abs(r.o)+r.d+r.k>0.004);
  const q=state.arQ.trim().toLowerCase(); if(q) rows=rows.filter(r=>name(r.c).toLowerCase().includes(q)||r.c.toLowerCase().includes(q));
  rows.sort((a,b)=>Math.abs(b.e)-Math.abs(a.e));
  const tot=rows.reduce((x,r)=>{x.o+=r.o;x.d+=r.d;x.k+=r.k;x.e+=r.e;return x;},{o:0,d:0,k:0,e:0});
  const nz=rows.filter(r=>Math.abs(r.e)>0.004).length; const opp=rows.filter(r=>r.e<-0.004);
  const top10=rows.slice(0,10).reduce((s,r)=>s+Math.max(r.e,0),0); const posTot=rows.reduce((s,r)=>s+Math.max(r.e,0),0);
  let h=periodHead(t.arTitle, `${t.asOf}: <b>${endOfLbl(P.e)}</b> · ${t.turnover}: ${P.label}`);
  h+=`<div class="toolbar"><div class="pills">${AR_LEDGERS.filter(l=>children[l]).map(l=>`<button data-led="${l}" aria-pressed="${l===led}"><span class="code" style="margin-right:5px">${l}</span>${t.arLedgers[l]}</button>`).join('')}</div></div>`;
  h+=`<div class="toolbar"><input type="search" id="arq" placeholder="${t.search}" value="${esc(state.arQ)}"><span style="color:var(--muted);font-size:12.5px">${rows.length} ${t.contragents}${q?' '+t.filtered:''}</span></div>`;

const MP_PL_DETAIL=[79,81,84,85,86,91,94,95,96,98,99,100,102,103,104,109,110,115,116];
const MP_BS_DETAIL=[125,126,128,130,131,132,133,134,138,139,140,141,142,143,144,146,147,149,150,151];
let _mpIdx=null;
function mpIndex(){
  if(_mpIdx) return _mpIdx;
  const pl=new Map(), bs=new Map(), cash=new Set();
  for(const r of MP_PL_DETAIL) for(const [c] of AVPL_SPEC[r]) if(!pl.has(c)) pl.set(c,r);
  for(const [c,r] of [['8 1 10',113],['8 2 10','int'],['8 2',104],['8 1',104],['9 1',102],['9 2',102],['7 4 10','sal'],['7 4 50','sal'],['7 4 15',93],['7 4',95],['7 3',91],['6','none'],['7','none'],['8','none'],['9','none']]) if(!pl.has(c)) pl.set(c,r);
  for(const r of MP_BS_DETAIL) for(const c of AVBS_CODES[r]) if(!bs.has(c)) bs.set(c,r);
  bs.set('5 3 10',155); bs.set('5 3 30',156); bs.set('1 6 35','t124');
  for(const [c,r] of [['1','t124'],['2','t129'],['3','t137'],['4','t148'],['5','t154']]) if(!bs.has(c)) bs.set(c,r);
  for(const [md,si,di,ki] of JR.r){ const d=JR.c[di], k=JR.c[ki]; const dc=isCash(d), kc=isCash(k); if(dc&&!kc&&k!=='1 6 35') cash.add(k); if(kc&&!dc&&d!=='1 6 35') cash.add(d); }
  return _mpIdx={pl,bs,cash};
}
function mpFind(map,code){ let c=code; while(c){ if(map.has(c)) return map.get(c); const i=c.lastIndexOf(' '); c=i<0?'':c.slice(0,i); } return null; }
function mpLinesOf(r){
  const ix=mpIndex(); const cls=r.code[0]; const o={pl:[],bs:[],cf:[]};
  if('6789'.includes(cls)){ const v=mpFind(ix.pl,r.code); if(v!==null) o.pl.push(v); }
  if('12345'.includes(cls) && !isCash(r.code)){ const v=mpFind(ix.bs,r.code); if(v!==null) o.bs.push(v); }
  if(isCash(r.code)) o.bs.push(125);
  if(SH_PAYROLL.includes(r.code)||SH_CONSULT.includes(r.code)) o.pl.push(92); else if(r.code.startsWith('3 1 32 ')) o.pl.push(93);
  for(const c of (r.stmt||[])){ o.cf.push(c); if(c==='interest_investors') o.pl.push(111); else if(c==='interest_sh') o.pl.push(112); else if(c==='interest_bank') o.pl.push(113); }
  if(!o.cf.length && ix.cash.has(r.code)) o.cf.push('op');
  if(isCash(r.code)) o.cf.push('cash');
  if(r.code==='1 6 35') o.cf.push('xfer');
  return o;
}
function mpLabels(r){

  const L=mpLinesOf(r); r._l={lang:state.lang,pl:L.pl.map(pl),bs:L.bs.map(bsl),cf:L.cf.map(cf)}; return r._l;

  const ctl=`<div class="more" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap"><button class="compact-btn" data-drillsort="date" aria-pressed="${!byAmt}">${t.pSortDate}</button><button class="compact-btn" data-drillsort="amt" aria-pressed="${byAmt}">${t.pSortAmt}</button>${r.rows.length>N?`<button class="compact-btn" data-drillmore="1">${t.pMore}</button>`:''}</div>`;
  return `<tr><td colspan="${colspan}" style="padding:0;background:var(--surface2)"><div class="postings-wrap"><table class="postings"><thead><tr><th>${t.pDate}</th><th>${t.pPurpose}</th><th>${scope==='ex'?t.pSupplier:t.pCounter}</th><th class="n">${t.pAmount}</th></tr></thead><tbody>${body}</tbody></table>${shown}${foot}${ctl}</div></td></tr>`;
}

/* ---------- wiring ---------- */
const R={ov:renderOV,bs:renderBS,pl:renderPL,cf:renderCF,mp:renderMapping,pb:renderPB,bb:renderBB,cfb:renderCFB,pob:renderPOB,asb:renderASB,avpl:renderAVPL,avbs:renderAVBS,avcf:renderAVCF,avpf:renderAVPF,avas:renderAVAS};
const BUDGET_TABS=['pb','bb','cfb','pob','asb','avpl','avbs','avcf','avpf','avas'];
function render(){ document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+state.tab)); document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.p===state.tab));
  const noMonth=BUDGET_TABS.includes(state.tab); document.getElementById('l-month').hidden=noMonth; document.getElementById('month').hidden=noMonth;
  R[state.tab](); syncTopScroll(); }
function syncTopScroll(){
  const panel=document.querySelector('.panel.on'); if(!panel) return;
  panel.querySelectorAll('.tablewrap').forEach(wrap=>{
    const w=wrap.querySelector('table')?.scrollWidth||wrap.scrollWidth;
    if(w<=wrap.clientWidth+1) return;
    const mirror=document.createElement('div'); mirror.className='top-scroll';
    const inner=document.createElement('div'); inner.style.width=w+'px'; mirror.appendChild(inner);
    wrap.parentNode.insertBefore(mirror, wrap);
    mirror.addEventListener('scroll',()=>{ wrap.scrollLeft=mirror.scrollLeft; });
    wrap.addEventListener('scroll',()=>{ mirror.scrollLeft=wrap.scrollLeft; });
  });
}
function buildChrome(){
  const t=T(); document.documentElement.lang=state.lang;
  document.getElementById('h-title').textContent=t.title;
  const dmy=s=>s.split('-').reverse().join('.');
  document.getElementById('h-sub').innerHTML=`${t.src} <b>${dmy(D.meta.asof)}</b> · ${t.journal} <b>${dmy(D.meta.first)} – ${dmy(D.meta.last)}</b> · ${t.allGel}`;
  document.getElementById('l-year').textContent=t.year; document.getElementById('l-month').textContent=t.month;
  document.querySelectorAll('#tabs button').forEach(b=>{ b.textContent=t.tabs[b.dataset.p]; if(BUDGET_TABS.includes(b.dataset.p)) b.hidden=!BUDGET; if(b.dataset.p==='mp') b.hidden=!MAPPING; });
  document.querySelectorAll('[data-rl]').forEach(el=>{ el.textContent=t.tabGroups[el.dataset.rl]; });
  document.querySelectorAll('.tab-row-wrap[data-budget-group]').forEach(w=>{ w.hidden=!BUDGET; });
  document.querySelectorAll('#lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.l===state.lang));
  document.querySelectorAll('#theme button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.th===state.theme));
  const s=D.meta.stats; document.getElementById('foot').textContent=t.foot({total:fmt(s.total,0),kept:fmt(s.kept,0),closing:fmt(s.skip_closing,0),offbal:s.skip_offbal,pre2026:fmt(s.pre2026,0)},s.fx_converted);
  const yr=document.getElementById('years'); yr.innerHTML=years.map(y=>`<button aria-pressed="${y===state.year}" data-y="${y}">${y}</button>`).join('');
  yr.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ state.year=b.dataset.y; if(state.month!==null && M.indexOf(`${state.year}-${state.month}`)<0) state.month=null; buildChrome(); render(); }));
  const ms=document.getElementById('month'); const avail=monthsOf(state.year).map(i=>M[i].slice(5));
  ms.innerHTML=`<option value="">${t.wholeYear}</option>`+avail.map(m=>`<option value="${m}" ${state.month===m?'selected':''}>${t.mL[+m-1]}</option>`).join('');
  ms.onchange=()=>{ state.month=ms.value||null; render(); };
}
document.getElementById('lang').addEventListener('click',e=>{ const b=e.target.closest('button[data-l]'); if(!b) return; state.lang=b.dataset.l; try{localStorage.setItem('volta-fin-lang',state.lang);}catch(_){} buildChrome(); render(); });
document.getElementById('theme').addEventListener('click',e=>{ const b=e.target.closest('button[data-th]'); if(!b) return; state.theme=b.dataset.th; document.documentElement.dataset.theme=state.theme; try{localStorage.setItem('volta-fin-theme',state.theme);}catch(_){} buildChrome(); });
document.getElementById('tabs').addEventListener('click',e=>{ const b=e.target.closest('button[data-p]'); if(!b) return; state.tab=b.dataset.p; try{localStorage.setItem('volta-fin-tab',state.tab);}catch(_){} render(); });
document.querySelector('main').addEventListener('click',e=>{
  const c=e.target.closest('[data-compact]'); if(c){ const id=c.dataset.compact; if(state.compactTabs.has(id)) state.compactTabs.delete(id); else state.compactTabs.add(id); render(); return; }
  const p=e.target.closest('[data-cellpost]'); if(p){ const [sc,key,f,tt]=p.dataset.cellpost.split('|'); const k=sc+'|'+key, v=f+'|'+tt;
    if(state.exOpenCell.get(k)===v) state.exOpenCell.delete(k); else { state.exOpenCell.set(k,v); state.drillN=40; } render(); return; }
  const ds=e.target.closest('[data-drillsort]'); if(ds){ state.drillSort=ds.dataset.drillsort; render(); return; }
  if(e.target.closest('[data-drillmore]')){ state.drillN+=200; render(); return; }
  const t=e.target.closest('[data-tg]'); if(!t) return; const id=t.dataset.tg; if(state.open.has(id)) state.open.delete(id); else state.open.add(id); render(); });
try{ const t=localStorage.getItem('volta-fin-tab'); if(t&&R[t]) state.tab=t; }catch(_){}
buildChrome(); render();
</script>
