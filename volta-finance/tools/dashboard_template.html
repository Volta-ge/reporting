<meta charset="utf-8">
<title>Volta_Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F3F5F4; --surface:#FFFFFF; --surface2:#EBEFEE; --ink:#16202A; --muted:#5B6B78; --faint:#8A98A3;
  --line:#D7DDDE; --line2:#E7ECEC; --accent:#1470A6; --accent-ink:#FFFFFF; --accent-soft:#E2EEF6;
  --amber:#C9722A; --amber-soft:#F7EADF; --pos:#2A7F5A; --neg:#B23F2E; --pos-soft:#E1F1E9; --neg-soft:#F6E3DF;
  --heat:20,112,166; --shadow:0 1px 2px rgba(22,32,42,.06),0 4px 14px rgba(22,32,42,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#12171B; --surface:#1A2126; --surface2:#222A30; --ink:#E4E9EC; --muted:#93A1AB; --faint:#6E7C86;
    --line:#2C363D; --line2:#242D34; --accent:#3A8DBA; --accent-ink:#0E141A; --accent-soft:#1E3241;
    --amber:#C27F3C; --amber-soft:#3A2B1B; --pos:#4CAF84; --neg:#E06A57; --pos-soft:#1B3328; --neg-soft:#3B221E;
    --heat:58,141,186; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#12171B; --surface:#1A2126; --surface2:#222A30; --ink:#E4E9EC; --muted:#93A1AB; --faint:#6E7C86;
  --line:#2C363D; --line2:#242D34; --accent:#3A8DBA; --accent-ink:#0E141A; --accent-soft:#1E3241;
  --amber:#C27F3C; --amber-soft:#3A2B1B; --pos:#4CAF84; --neg:#E06A57; --pos-soft:#1B3328; --neg-soft:#3B221E;
  --heat:58,141,186; --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Georgian","Sylfaen","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.45}
.num,.code,td.n,th.n{font-family:"IBM Plex Mono","Consolas",monospace;font-variant-numeric:tabular-nums}
a{color:var(--accent)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1380px;margin:0 auto;padding:18px 28px 0;display:flex;flex-wrap:wrap;gap:12px 32px;align-items:flex-end;justify-content:space-between}
.brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.brand .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.brand .sub b{color:var(--ink);font-weight:500}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-bottom:14px}
.ctl-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-right:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface2)}
.seg button{padding:6px 11px;font-size:13px;font-weight:500;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg.lang button{padding:6px 10px;font-size:12px;letter-spacing:.04em}
.seg.theme button{padding:5px 11px;font-size:14px;line-height:1}
select{font:inherit;font-size:13px;padding:6px 28px 6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface2);color:var(--ink);appearance:none;
 background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.tabs{max-width:1380px;margin:0 auto;padding:6px 28px 0;display:flex;flex-direction:column;gap:5px}
.tab-row-wrap{display:flex;flex-direction:column;gap:1px}
.tab-row-label{font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:0 2px}
.tab-row{display:flex;gap:2px;overflow-x:auto;overflow-y:hidden}
.tabs button{padding:10px 14px;font-size:13.5px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}

main{max-width:1380px;margin:0 auto;padding:22px 28px 60px}
.panel{display:none}.panel.on{display:block}
.period{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;margin:0 0 16px}
.period h2{margin:0;font-size:17px;font-weight:600}
.period .win{color:var(--muted);font-size:13px}
.period .win b{color:var(--ink);font-weight:500}
.note{color:var(--muted);font-size:12.5px;margin:10px 0 0;max-width:80ch}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line2);border-radius:8px;padding:12px 14px 11px}
.kpi .l{font-size:11.5px;color:var(--muted);letter-spacing:.02em}
.kpi .v{font-size:21px;font-weight:600;margin-top:4px;letter-spacing:-.01em}
.kpi .d{font-size:12px;margin-top:3px;color:var(--muted)}
.kpi .d .up{color:var(--pos)}.kpi .d .dn{color:var(--neg)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:900px){.grid2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line2);border-radius:8px;box-shadow:var(--shadow);padding:14px 16px 12px}
.card h3{margin:0 0 2px;font-size:14px;font-weight:600;display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.compact-btn{font-size:11.5px;font-weight:500;color:var(--accent);border:1px solid var(--line);border-radius:6px;padding:4px 10px;background:var(--surface2);white-space:nowrap;margin-left:auto}
.compact-btn:hover{background:var(--accent-soft)}
.card .cap{color:var(--muted);font-size:12px;margin-bottom:8px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:2px 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:5px;white-space:nowrap;transform:translate(-50%,-110%);display:none;z-index:5;box-shadow:var(--shadow)}
.tip b{font-weight:600}

.tablewrap{overflow-x:auto;overflow-y:visible;background:var(--surface);border:1px solid var(--line2);border-radius:8px;box-shadow:var(--shadow);position:relative}
.top-scroll{overflow-x:auto;overflow-y:hidden;height:14px}
.top-scroll>div{height:1px}
table.ledger{border-collapse:collapse;width:100%;min-width:640px}
.ledger th{font-size:11.5px;font-weight:500;color:var(--muted);text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);letter-spacing:.02em;white-space:nowrap;background:var(--surface);position:sticky;top:0;z-index:2}
.ledger th.n,.ledger td.n{text-align:right}
.ledger td{padding:6px 12px;border-bottom:1px solid var(--line2);vertical-align:middle;white-space:nowrap}
.ledger td.name{white-space:normal;min-width:340px;max-width:600px;position:sticky;left:0;z-index:1;background:var(--surface)}
.ledger thead th:first-child{left:0;z-index:3}
#p-ex .ledger td.name{white-space:nowrap;min-width:0;max-width:none}
.ledger tr:last-child td{border-bottom:0}
.ledger tr.lvl1 td{font-weight:600;background:var(--surface2)}
.ledger tr.lvl2 td{font-weight:500}
.ledger tr.total td{font-weight:600;border-top:2px solid var(--line);background:var(--surface2)}
.ledger tr.sub td{font-weight:600;border-top:1px solid var(--line)}
.ledger tr.head td{font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;padding-top:14px;font-weight:500}
.ledger td.n.neg{color:var(--neg)}
.ledger td.n.zero{color:var(--faint)}
.ledger td.n.pos{color:var(--pos)}
.code{color:var(--faint);font-size:11.5px;margin-right:8px}
.tg{display:inline-block;width:16px;height:16px;line-height:14px;text-align:center;border:1px solid var(--line);border-radius:3px;font-size:11px;color:var(--muted);margin-right:6px;vertical-align:1px;background:var(--surface)}
.tg.open{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.tg.none{visibility:hidden}
.ind1{padding-left:22px}.ind2{padding-left:44px}.ind3{padding-left:66px}.ind4{padding-left:88px}
.more{padding:8px 12px;font-size:12.5px;color:var(--accent);font-weight:500}
.pct{color:var(--muted);font-size:11.5px;margin-left:6px}
.bar{display:inline-block;height:6px;border-radius:3px;background:var(--accent);vertical-align:middle;margin-right:8px;opacity:.75}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px}
.toolbar input[type=search]{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);min-width:260px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills button{padding:5px 11px;border:1px solid var(--line);border-radius:999px;font-size:12.5px;color:var(--muted);background:var(--surface)}
.pills button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}
.heat{background:rgba(var(--heat),calc(var(--h) * .28))}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--surface2);color:var(--muted);margin-left:6px;vertical-align:1px}
.check{margin-top:10px;font-size:12.5px;color:var(--muted)}
.check .ok{color:var(--pos);font-weight:500}
.check .bad{color:var(--neg);font-weight:500}
.mt{margin-top:18px}
.toolbar input[type=date]{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.toolbar .fl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.toolbar button.reset{font-size:12.5px;color:var(--accent);padding:5px 8px}
.st{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;font-weight:500;white-space:nowrap}
.st.ok{background:var(--pos-soft);color:var(--pos)}
.st.diff{background:var(--amber-soft);color:var(--amber)}
.st.no_oris{background:var(--neg-soft);color:var(--neg)}
.st.no_rs{background:var(--accent-soft);color:var(--accent)}
.st.late{background:var(--surface2);color:var(--muted)}
.ledger tr.cur td{background:var(--accent-soft)}
footer{max-width:1380px;margin:0 auto;padding:0 28px 40px;color:var(--faint);font-size:12px}
@media (prefers-reduced-motion:no-preference){.chart rect,.chart circle{transition:opacity .15s}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <h1 id="h-title"></h1>
      <div class="sub" id="h-sub"></div>
    </div>
    <div class="controls">
      <span class="ctl-label" id="l-year"></span><div class="seg" id="years"></div>
      <span class="ctl-label" id="l-month"></span><select id="month"></select>
      <div class="seg lang" id="lang"><button data-l="ka">ქარ</button><button data-l="en">EN</button></div>
      <div class="seg theme" id="theme"><button data-th="light" aria-label="light">☀</button><button data-th="dark" aria-label="dark">☾</button></div>
    </div>
  </div>
  <nav class="tabs" role="tablist" id="tabs">
    <div class="tab-row-wrap">
      <span class="tab-row-label" data-rl="general"></span>
      <div class="tab-row">
        <button role="tab" data-p="ov"></button>
        <button role="tab" data-p="ar"></button>
        <button role="tab" data-p="ex"></button>
      </div>
    </div>
    <div class="tab-row-wrap" data-budget-group="1">
      <span class="tab-row-label" data-rl="budgets"></span>
      <div class="tab-row">
        <button role="tab" data-p="pb"></button>
        <button role="tab" data-p="bb"></button>
        <button role="tab" data-p="cfb"></button>
        <button role="tab" data-p="pob"></button>
        <button role="tab" data-p="asb"></button>
      </div>
    </div>
    <div class="tab-row-wrap">
      <span class="tab-row-label" data-rl="statements"></span>
      <div class="tab-row">
        <button role="tab" data-p="pl"></button>
        <button role="tab" data-p="bs"></button>
        <button role="tab" data-p="cf"></button>
        <button role="tab" data-p="tb"></button>
      </div>
    </div>
    <div class="tab-row-wrap" data-budget-group="1">
      <span class="tab-row-label" data-rl="avb"></span>
      <div class="tab-row">
        <button role="tab" data-p="avpl"></button>
        <button role="tab" data-p="avbs"></button>
        <button role="tab" data-p="avcf"></button>
        <button role="tab" data-p="avpf"></button>
        <button role="tab" data-p="avas"></button>
      </div>
    </div>
  </nav>
</header>

<main>
  <section class="panel" id="p-ov"></section>
  <section class="panel" id="p-ar"></section>
  <section class="panel" id="p-ex"></section>
  <section class="panel" id="p-pb"></section>
  <section class="panel" id="p-bb"></section>
  <section class="panel" id="p-cfb"></section>
  <section class="panel" id="p-pob"></section>
  <section class="panel" id="p-asb"></section>
  <section class="panel" id="p-bs"></section>
  <section class="panel" id="p-pl"></section>
  <section class="panel" id="p-cf"></section>
  <section class="panel" id="p-tb"></section>
  <section class="panel" id="p-avpl"></section>
  <section class="panel" id="p-avbs"></section>
  <section class="panel" id="p-avcf"></section>
  <section class="panel" id="p-avpf"></section>
  <section class="panel" id="p-avas"></section>
</main>
<footer id="foot"></footer>
<div class="tip" id="tip"></div>

<script>
const D = __DATA__;
const BUDGET = __BUDGET__;   // 2026 P&L/BS budget, extracted from the finance team's Excel model (null if not built)
const M = D.months, NM = M.length;
const years = [...new Set(M.map(m=>m.slice(0,4)))];
const state = { year: years[years.length-1], month: null, tab: 'ov', lang: 'ka', open: new Set(), arLedger: '1 4 10', arQ: '', arN: 100, compactTabs: new Set(), theme: null };
try{ const l=localStorage.getItem('volta-fin-lang'); if(l==='en'||l==='ka') state.lang=l; }catch(_){}
try{ const th=localStorage.getItem('volta-fin-theme'); if(th==='light'||th==='dark'){ state.theme=th; document.documentElement.dataset.theme=th; } }catch(_){}

/* ---------- i18n ---------- */
const L = {
ka:{
  title:'შპს ვოლტა · ფინანსური ანგარიშგება', src:'წყარო: ორისი, ბაზის ასლი', journal:'ჟურნალი', allGel:'ყველა თანხა ლარში (₾)',
  year:'წელი', month:'თვე', wholeYear:'მთელი წელი',
  tabs:{ov:'მიმოხილვა',bs:'ბალანსი',pl:'მოგება-ზარალი',tb:'ბრუნვითი უწყისი',cf:'ფულადი ნაკადები',ar:'დებიტორები · კრედიტორები',ex:'ხარჯების ანალიზი',pb:'PL Budget',bb:'BS Budget',cfb:'CF Budget',pob:'Portfolio Budget',asb:'Assumptions Budget',avpl:'PL Actual vs Budget',avbs:'BS Actual vs Budget',avcf:'CF Actual vs Budget',avpf:'Portfolio Actual vs Budget',avas:'Assumptions Actual vs Budget'},
  tabGroups:{general:'ზოგადი',budgets:'ბიუჯეტები',statements:'ანგარიშგებები',avb:'ფაქტი vs ბიუჯეტი'},
  compactAll:'მხოლოდ მთავარი მუხლები', expandAll:'ყველა მუხლი',
  actual:'ფაქტი', budget:'ბიუჯეტი', diff:'სხვაობა', ytd:'დაგროვილი',
  avTitlePL:'მოგება-ზარალი: ფაქტი vs ბიუჯეტი', avTitleBS:'ბალანსი: ფაქტი vs ბიუჯეტი', avTitleCF:'ფულადი ნაკადები: ფაქტი vs ბიუჯეტი',

};
const T = () => L[state.lang];
const GM = () => T().mS, GMF = () => T().mL;

/* ---------- account tree ---------- */
const ACC = D.acc;
const children = {};
for (const c of Object.keys(ACC)) { const p = parentOf(c); if (p!==null) (children[p] ||= []).push(c); }
for (const p in children) children[p].sort(cmpCode);
function parentOf(c){ const i=c.lastIndexOf(' '); return i<0?null:c.slice(0,i); }
function cmpCode(a,b){ const x=a.split(' '),y=b.split(' '); for(let i=0;i<Math.max(x.length,y.length);i++){ if(x[i]===undefined)return -1; if(y[i]===undefined)return 1; const nx=+x[i],ny=+y[i]; if(!isNaN(nx)&&!isNaN(ny)){ if(nx!==ny)return nx-ny; } else if(x[i]!==y[i]) return x[i]<y[i]?-1:1; } return 0; }
const name = c => (state.lang==='en' && ACC_EN[c]) ? ACC_EN[c] : (ACC[c]||[T().unknownAcc])[0];
const level = c => c.split(' ').length;

/* ---------- period ---------- */
function monthsOf(y){ const a=[]; M.forEach((m,i)=>{ if(m.slice(0,4)===y) a.push(i); }); return a; }
/* Full Jan-Dec column set for a year, for month-by-month comparison tables/charts.
   Months with no data yet get a virtual index (> any real one) so stats()'s existing "m < s -> opening"
   rule carries the last real balance forward unchanged, and "m <= e" flow sums stay correctly at 0 -
   no change needed to stats()/close()/bsVal() themselves. */
function yearMonths(y){ const out=[]; for(let mm=1; mm<=12; mm++){ const key=`${y}-${String(mm).padStart(2,'0')}`; const real=M.indexOf(key); out.push({idx: real>=0?real:(NM+mm), mm, real:real>=0}); } return out; }
const ymLabel = x => GM()[x.mm-1];
const ymLabelF = x => GMF()[x.mm-1];
const mName = i => GMF()[+M[i].slice(5)-1];
const yLbl = y => state.lang==='en' ? y : `${y} წელი`;
function period(){
  const ys = monthsOf(state.year);
  if (state.month===null){
    const s=ys[0], e=ys[ys.length-1];
    const py = String(+state.year-1); const lastMon=M[e].slice(5); const pys = monthsOf(py).filter(i=>M[i].slice(5)<=lastMon);
    const partial = pys.length && (ys.length<12 || pys.length<12);
    return { s, e, label: `${yLbl(state.year)} (${mName(s)} – ${mName(e)})`, kind:'year',
      cmp: pys.length? {s:pys[0], e:pys[pys.length-1], label: partial? `${py} (${mName(pys[0])} – ${mName(pys[pys.length-1])})` : yLbl(py)}:null,
      cmpBS: s>0? {e:s-1, label: state.lang==='en' ? `end of ${M[s-1].slice(0,4)} (${mName(s-1)})` : `${M[s-1].slice(0,4)} წლის ბოლო (${mName(s-1)})`}:null };
  }
  const idx = M.indexOf(`${state.year}-${state.month}`);
  const s=idx,e=idx; const mn=+state.month-1;
  const pyi = M.indexOf(`${+state.year-1}-${state.month}`);
  return { s,e,label:`${GMF()[mn]} ${state.year}`, kind:'month',
    cmp: pyi>=0? {s:pyi,e:pyi,label:`${GMF()[mn]} ${+state.year-1}`}:null,
    cmpBS: s>0? {e:s-1,label:`${mName(s-1)} ${M[s-1].slice(0,4)}`}:null };
}
function endLabel(e){ return `${mName(e)} ${M[e].slice(0,4)}`; }
const endOfLbl = e => state.lang==='en' ? `end of ${endLabel(e)}` : `${endLabel(e)} ბოლოს`;

/* ---------- stats ---------- */
const cache = new Map();
function stats(s,e){
  const key=s+':'+e; if(cache.has(key)) return cache.get(key);
  const st=new Map(); const get=c=>{ let v=st.get(c); if(!v){v={o:0,d:0,c:0}; st.set(c,v);} return v; };
  for (const code in D.agg){ const a=D.agg[code]; let o=0,d=0,c=0;
    for(let i=0;i<a.length;i+=3){ const m=a[i]; if(m<s) o+=a[i+1]-a[i+2]; else if(m<=e){ d+=a[i+1]; c+=a[i+2]; } }
    if(!o&&!d&&!c) continue;
    let p=code; while(p!==null){ const v=get(p); v.o+=o; v.d+=d; v.c+=c; p=parentOf(p); }
  }
  cache.set(key,st); return st;
}
const S = (st,c)=>st.get(c)||{o:0,d:0,c:0};
const close = v => v.o+v.d-v.c;
function plNet(st){ let o=0,n=0; for(const c of ['6','7','8','9']){ const v=S(st,c); o+=v.o; n+=v.d-v.c; } return {o,n}; }

/* ---------- formatting ---------- */
const NBSP=' ';
function fmt(n,dec=2){ if(n===null||n===undefined||isNaN(n)) return '–'; const neg=n<-0.004; const a=Math.abs(n).toFixed(dec); const [i,f]=a.split('.'); const g=i.replace(/\B(?=(\d{3})+(?!\d))/g,NBSP); return (neg?'−':'')+g+(f?'.'+f:''); }
function fmtK(n){ const a=Math.abs(n); if(a>=1e6) return (n<0?'−':'')+(a/1e6).toFixed(2)+NBSP+T().mln; if(a>=1e4) return (n<0?'−':'')+(a/1e3).toFixed(1)+NBSP+T().ths; return fmt(n,0); }
function cell(n,opts={}){ const cls=['n']; if(Math.abs(n)<0.005) cls.push('zero'); else if(n<0) cls.push('neg'); else if(opts.pos) cls.push('pos'); return `<td class="${cls.join(' ')}">${fmt(n)}</td>`; }
function delta(cur,prev,invert){ if(prev===null||prev===undefined||Math.abs(prev)<0.005) return `<span>${T().prev}: –</span>`; const d=cur-prev; const p=d/Math.abs(prev)*100; const good=invert?d<0:d>0; return `<span class="${Math.abs(p)<0.05?'':(good?'up':'dn')}">${d>=0?'+':'−'}${fmt(Math.abs(d),0)} (${p>=0?'+':'−'}${Math.abs(p).toFixed(1)}%)</span>`; }
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function periodHead(title, sub, extra){ return `<div class="period"><h2>${title}</h2><span class="win">${sub}</span>${extra||''}</div>`; }
function compactBtn(id){ const t=T(); const on=state.compactTabs.has(id); return `<button class="compact-btn" data-compact="${id}" aria-pressed="${on}">${on?t.expandAll:t.compactAll}</button>`; }
const gel = `<span style="font-size:13px;color:var(--muted)"> ₾</span>`;

/* ---------- generic tree table ---------- */
function treeRows(roots, st, opts){
  const out=[]; const maxL=opts.maxLevel||5;
  const walk=(code,lv)=>{
    const kids=(children[code]||[]).filter(k=>opts.keep? opts.keep(k,st):true);
    const has=kids.length>0 && lv<maxL;
    const id=opts.prefix+code;
    const isOpen = state.open.has(id) || (lv<= (opts.openTo||1));
    out.push(opts.row(code,lv,has,isOpen,id));
    if(has && isOpen){
      let list=kids;
      if(kids.length>150){ list=kids.slice().sort((a,b)=>Math.abs(opts.sortVal(b,st))-Math.abs(opts.sortVal(a,st))).slice(0,150); }
      for(const k of list) walk(k,lv+1);
      if(kids.length>150) out.push(`<tr><td colspan="9" class="more ind${Math.min(lv,4)}">${T().shownTop(150,kids.length)}</td></tr>`);
    }
  };
  for(const r of roots) walk(r,1);
  return out.join('');
}
function tgl(has,open,id){ return has? `<button class="tg ${open?'open':''}" data-tg="${id}" aria-label="${open?T().collapse:T().expand}">${open?'−':'+'}</button>` : `<span class="tg none"></span>`; }
function nameCell(code,lv,has,open,id,label){ return `<td class="name ind${Math.min(lv-1,4)}">${tgl(has,open,id)}<span class="code">${esc(code)}</span>${esc(label||name(code))}</td>`; }

/* ---------- charts ---------- */
const tip=document.getElementById('tip');
function showTip(ev,html){ tip.innerHTML=html; tip.style.display='block'; const r=ev.currentTarget.closest('.chart').getBoundingClientRect(); tip.style.left=(ev.clientX-r.left)+'px'; tip.style.top=(ev.clientY-r.top-8)+'px'; }
function hideTip(){ tip.style.display='none'; }
function niceMax(v){ if(v<=0) return 1; const p=Math.pow(10,Math.floor(Math.log10(v))); const f=v/p; const n= f<=1?1: f<=2?2: f<=2.5?2.5: f<=5?5:10; return n*p; }
function attachTips(el){ el.querySelectorAll('rect[data-tt]').forEach(r=>{ r.addEventListener('mousemove',ev=>showTip(ev,r.dataset.tt)); r.addEventListener('mouseleave',hideTip); }); }
function barChart(el, labels, series, line){
  const W=820,H=250,Lm=58,R=12,Tm=14,B=30; const iw=W-Lm-R, ih=H-Tm-B;
  let mx=0,mn=0; series.forEach(s=>s.vals.forEach(v=>{mx=Math.max(mx,v);mn=Math.min(mn,v);})); if(line) line.vals.forEach(v=>{mx=Math.max(mx,v);mn=Math.min(mn,v);});
  mx=niceMax(mx); mn= mn<0? -niceMax(-mn):0; const span=mx-mn||1;
  const y=v=>Tm+ih-(v-mn)/span*ih; const n=labels.length; const gw=iw/n; const bw=Math.max(4,(gw*0.7)/series.length-2);
  let g=''; for(let i=0;i<=5;i++){ const v=mn+span*i/5; const yy=y(v); g+=`<line x1="${Lm}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line2)" stroke-width="1"/><text x="${Lm-8}" y="${yy+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${fmtK(v)}</text>`; }
  if(mn<0) g+=`<line x1="${Lm}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1"/>`;
  let bars='',hit='';
  labels.forEach((lb,i)=>{ const x0=Lm+i*gw+(gw-(bw+2)*series.length)/2;
    series.forEach((s,j)=>{ const v=s.vals[i]; const x=x0+j*(bw+2); const y0=y(0), y1=y(v); const top=Math.min(y0,y1), h=Math.abs(y0-y1);
      bars+=`<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,0).toFixed(1)}" rx="2" fill="${s.color}" stroke="var(--surface)" stroke-width="1"/>`; });
    g+=`<text x="${Lm+i*gw+gw/2}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)">${lb}</text>`;
    const tt=`<b>${lb}</b>`+series.map(s=>`<br>${s.name}: ${fmt(s.vals[i],0)} ₾`).join('')+(line?`<br>${line.name}: ${fmt(line.vals[i],0)} ₾`:'');
    hit+=`<rect x="${Lm+i*gw}" y="${Tm}" width="${gw}" height="${ih}" fill="transparent" data-tt="${esc(tt).replace(/"/g,'&quot;')}"/>`; });
  let ln='';
  if(line){ const pts=line.vals.map((v,i)=>`${(Lm+i*gw+gw/2).toFixed(1)},${y(v).toFixed(1)}`); ln=`<polyline points="${pts.join(' ')}" fill="none" stroke="${line.color}" stroke-width="2" stroke-linejoin="round"/>`+line.vals.map((v,i)=>`<circle cx="${(Lm+i*gw+gw/2).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.5" fill="${line.color}" stroke="var(--surface)" stroke-width="2"/>`).join(''); }
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img">${g}${bars}${ln}${hit}</svg>`; attachTips(el);
}
function lineChart(el, labels, series){
  const W=820,H=250,Lm=58,R=12,Tm=14,B=30; const iw=W-Lm-R, ih=H-Tm-B;
  let mx=0,mn=0; series.forEach(s=>s.vals.forEach(v=>{mx=Math.max(mx,v);mn=Math.min(mn,v);})); mx=niceMax(mx); mn=mn<0?-niceMax(-mn):0; const span=mx-mn||1;
  const n=labels.length; const x=i=>Lm+(n>1? i*iw/(n-1):iw/2); const y=v=>Tm+ih-(v-mn)/span*ih;
  let g=''; for(let i=0;i<=5;i++){ const v=mn+span*i/5; g+=`<line x1="${Lm}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line2)"/><text x="${Lm-8}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${fmtK(v)}</text>`; }
  labels.forEach((lb,i)=>{ g+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="11" fill="var(--muted)">${lb}</text>`; });
  let paths='';
  series.forEach((s,j)=>{ const pts=s.vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`);
    if(j===0) paths+=`<path d="M${x(0).toFixed(1)},${y(0)} L${pts.join(' L')} L${x(n-1).toFixed(1)},${y(0)} Z" fill="${s.color}" opacity=".12"/>`;
    paths+=`<polyline points="${pts.join(' ')}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`;
    paths+=s.vals.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${i===n-1?4.5:3}" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`).join(''); });
  let hit=''; labels.forEach((lb,i)=>{ const tt=`<b>${lb}</b>`+series.map(s=>`<br>${s.name}: ${fmt(s.vals[i],0)} ₾`).join(''); const w=n>1?iw/(n-1):iw; hit+=`<rect x="${x(i)-w/2}" y="${Tm}" width="${w}" height="${ih}" fill="transparent" data-tt="${esc(tt).replace(/"/g,'&quot;')}"/>`; });
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img">${g}${paths}${hit}</svg>`; attachTips(el);
}
const cssVar=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* ---------- P&L model ---------- */
function plLines(st){
  const inc=c=>{const v=S(st,c); return v.c-v.d;}, exp=c=>{const v=S(st,c); return v.d-v.c;};
  const rev=inc('6'), cogs=exp('7 2')+exp('7 1'), gross=rev-cogs, dist=exp('7 3'), adm=exp('7 4'), op=gross-dist-adm;
  const noi=inc('8 1'), noe=exp('8 2'), ext=inc('9 1'), oth=exp('9 2'); const net=op+noi-noe+ext-oth;
  return {rev,cogs,gross,dist,adm,op,noi,noe,ext,oth,net};
}
function cashClose(st){ return close(S(st,'1 1'))+close(S(st,'1 2')); }
const kpi=(l,v,d)=>`<div class="kpi"><div class="l">${l}</div><div class="v num">${typeof v==='number'?fmt(v,0)+gel:v}</div><div class="d">${d||''}</div></div>`;

/* ---------- OVERVIEW ---------- */
function renderOV(){
  const t=T(); const P=period(); const st=stats(P.s,P.e); const cs=P.cmp?stats(P.cmp.s,P.cmp.e):null;
  const pl=plLines(st), pp=cs?plLines(cs):null;
  const ar=close(S(st,'1 4')), liab=-(close(S(st,'3'))+close(S(st,'4'))), cash=cashClose(st);
  const bsPrev=P.cmpBS?stats(P.cmpBS.e+1,P.cmpBS.e):null;
  const prevAR=bsPrev?S(bsPrev,'1 4').o:null, prevCash=bsPrev?(S(bsPrev,'1 1').o+S(bsPrev,'1 2').o):null, prevLiab=bsPrev?-(S(bsPrev,'3').o+S(bsPrev,'4').o):null;
  let h=periodHead(t.tabs.ov, `${t.period}: <b>${P.label}</b>${P.cmp?` · ${t.compare}: ${P.cmp.label}`:''}`);
  h+=`<div class="kpis">${kpi(t.revenue,pl.rev,pp&&delta(pl.rev,pp.rev))}${kpi(t.gross,pl.gross,pp&&delta(pl.gross,pp.gross))}${kpi(t.net,pl.net,pp&&delta(pl.net,pp.net))}${kpi(t.cash+' · '+endLabel(P.e),cash,prevCash!==null&&delta(cash,prevCash))}${kpi(t.ar,ar,prevAR!==null&&delta(ar,prevAR))}${kpi(t.liab,liab,prevLiab!==null&&delta(liab,prevLiab,true))}</div>`;
  const YM=yearMonths(state.year); const ys=YM.map(x=>x.idx); const labels=YM.map(ymLabel);
  const revV=[],netV=[],cashV=[],arV=[];
  ys.forEach(i=>{ const s1=stats(i,i); const p1=plLines(s1); revV.push(p1.rev); netV.push(p1.net); cashV.push(cashClose(s1)); arV.push(close(S(s1,'1 4'))); });
  h+=`<div class="grid2"><div class="card"><h3>${t.chRev}</h3><div class="cap">${yLbl(state.year)}, ₾</div><div class="legend"><span><i style="background:${cssVar('--accent')}"></i>${t.revenue}</span><span><i style="background:${cssVar('--amber')}"></i>${t.net}</span></div><div class="chart" id="c-rev"></div></div>
  <div class="card"><h3>${t.chCash}</h3><div class="cap">${yLbl(state.year)}, ${t.eomBal}, ₾</div><div class="legend"><span><i style="background:${cssVar('--accent')}"></i>${t.cashLeg}</span><span><i style="background:${cssVar('--amber')}"></i>${t.arLeg}</span></div><div class="chart" id="c-cash"></div></div></div>`;
  h+=`<div class="card mt"><h3>${t.yearly}</h3><div class="cap">${t.yearlyCap}</div><div class="tablewrap" style="box-shadow:none;border:0"><table class="ledger"><thead><tr><th>${t.year}</th><th class="n">${t.revenue}</th><th class="n">${t.gross}</th><th class="n">${t.margin}</th><th class="n">${t.adm}</th><th class="n">${t.net}</th><th class="n">${t.cashYE}</th><th class="n">${t.arShort}</th><th class="n">${t.liabShort}</th></tr></thead><tbody>`;
  for(const y of years){ const ym=monthsOf(y); const s1=stats(ym[0],ym[ym.length-1]); const p1=plLines(s1); h+=`<tr><td class="num">${y}${ym.length<12?`<span class="badge">${ym.length} ${t.months}</span>`:''}</td>${cell(p1.rev)}${cell(p1.gross)}<td class="n">${p1.rev?(p1.gross/p1.rev*100).toFixed(1)+'%':'–'}</td>${cell(p1.adm)}${cell(p1.net,{pos:true})}${cell(cashClose(s1))}${cell(close(S(s1,'1 4')))}${cell(-(close(S(s1,'3'))+close(S(s1,'4'))))}</tr>`; }
  h+=`</tbody></table></div></div>`;
  h+=`<div class="card mt"><h3>${t.monthlySum}</h3><div class="cap">${t.monthlyCap}</div><div class="tablewrap" style="box-shadow:none;border:0"><table class="ledger"><thead><tr><th>${t.month}</th><th class="n">${t.revenue}</th><th class="n">${t.gross}</th><th class="n">${t.margin}</th><th class="n">${t.adm}</th><th class="n">${t.net}</th><th class="n">${t.cashME}</th><th class="n">${t.arShort}</th><th class="n">${t.liabShort}</th></tr></thead><tbody>`;
  for(const x of YM){ const s1=stats(x.idx,x.idx); const p1=plLines(s1); h+=`<tr><td class="num" ${!x.real?'style="color:var(--faint)"':''}>${ymLabelF(x)}</td>${cell(p1.rev)}${cell(p1.gross)}<td class="n">${p1.rev?(p1.gross/p1.rev*100).toFixed(1)+'%':'–'}</td>${cell(p1.adm)}${cell(p1.net,{pos:true})}${cell(cashClose(s1))}${cell(close(S(s1,'1 4')))}${cell(-(close(S(s1,'3'))+close(S(s1,'4'))))}</tr>`; }
  h+=`</tbody></table></div></div>`;
  const el=document.getElementById('p-ov'); el.innerHTML=h;
  barChart(el.querySelector('#c-rev'),labels,[{name:t.revenue,color:cssVar('--accent'),vals:revV}],{name:t.net,color:cssVar('--amber'),vals:netV});
  lineChart(el.querySelector('#c-cash'),labels,[{name:t.cashLeg,color:cssVar('--accent'),vals:cashV},{name:t.arLeg,color:cssVar('--amber'),vals:arV}]);
}

/* ---------- BALANCE SHEET ---------- */
function bsVal(st,code){ const v=S(st,code); let x=close(v); if(code==='5'||code==='5 3'||code==='5 3 30'){ const p=plNet(st); x+=p.o+p.n; } const cls=code[0]; return (cls==='1'||cls==='2')? x : -x; }
function bsOpen(st,code){ const v=S(st,code); let x=v.o; if(code==='5'||code==='5 3'||code==='5 3 30'){ x+=plNet(st).o; } const cls=code[0]; return (cls==='1'||cls==='2')? x : -x; }
function renderBS(){
  const t=T(); const P=period(); const st=stats(P.s,P.e);
  const A=bsVal(st,'1')+bsVal(st,'2'), Lb=bsVal(st,'3')+bsVal(st,'4'), E=bsVal(st,'5');
  const diff=A-(Lb+E);
  let h=periodHead(t.bs, `${t.asOf}: <b>${endOfLbl(P.e)}</b>`);
  h+=`<div class="check">${t.bsCheck} <span class="${Math.abs(diff)<0.05?'ok':'bad'} num">${fmt(diff)}</span></div>`;
  h+=`<p class="note">${t.bsNote}</p>`;
  const YM=yearMonths(state.year); const ys=YM.map(x=>x.idx);
  if(ys.length>1){

/* ---------- CASH FLOW ---------- */
const CF_RULES=[
  c=>c.startsWith('1 4 10')||c.startsWith('3 1 20'),
  c=>c.startsWith('3 1 10')||c.startsWith('3 1 31'),
  c=>c.startsWith('1 6')||c.startsWith('7 2')||c.startsWith('7 1'),
  c=>c.startsWith('3 1 32')||c.startsWith('3 1 30')||c.startsWith('7 4 10')||c.startsWith('1 4 30')||c.startsWith('3 1 60'),
  c=>c.startsWith('3 3'),
  c=>c.startsWith('3 2')||c.startsWith('4 1')||c.startsWith('4 2')||c.startsWith('1 4 50'),
  c=>c.startsWith('5'),
  c=>c.startsWith('2')||c.startsWith('1 3'),
  c=>c.startsWith('7'),
  c=>c.startsWith('8')||c.startsWith('9'),
  c=>true];
function cfGroup(c){ for(let i=0;i<CF_RULES.length;i++) if(CF_RULES[i](c)) return i; return CF_RULES.length-1; }
const isCash=c=>c.startsWith('1 1')||c.startsWith('1 2');
function renderCF(){
  const t=T(); const P=period(); const st=stats(P.s,P.e);
  const byAcc=new Map(); let tin=0,tout=0,trIn=0,trOut=0;
  for(const [cash,ctr,m,i,o] of D.cf){ if(m<P.s||m>P.e) continue;
    const a=byAcc.get(cash)||{i:0,o:0,ti:0,to:0}; byAcc.set(cash,a);
    if(isCash(ctr)){ a.ti+=i; a.to+=o; trIn+=i; trOut+=o; continue; }
    a.i+=i; a.o+=o; tin+=i; tout+=o; }
  const open=S(st,'1 1').o+S(st,'1 2').o, end=cashClose(st);
  let h=periodHead(t.cfTitle, `${t.period}: <b>${P.label}</b> · ${t.cfSub}`);
  h+=`<div class="kpis">${kpi(t.cashOpen,open)}${kpi(t.inflow,tin)}${kpi(t.outflow,tout)}${kpi(t.netFlow,tin-tout)}${kpi(t.cashEnd,end)}</div>`;
  const YM=yearMonths(state.year); const ys=YM.map(x=>x.idx); const labels=YM.map(ymLabel); const inV=ys.map(()=>0), outV=ys.map(()=>0);
  for(const [cash,ctr,m,i,o] of D.cf){ const j=ys.indexOf(m); if(j<0||isCash(ctr)) continue; inV[j]+=i; outV[j]+=o; }
  h+=`<div class="card"><h3>${t.cfChart}</h3><div class="cap">${yLbl(state.year)}, ${t.cfChartCap}</div><div class="legend"><span><i style="background:${cssVar('--accent')}"></i>${t.inflow}</span><span><i style="background:${cssVar('--amber')}"></i>${t.outflow}</span></div><div class="chart" id="c-cf"></div></div>`;
  h+=`<div class="tablewrap mt"><table class="ledger"><thead><tr><th>${t.account}</th><th class="n">${t.atStart}</th><th class="n">${t.inflow}</th><th class="n">${t.outflow}</th><th class="n">${t.transfersNet}</th><th class="n">${t.atEnd}</th></tr></thead><tbody>`;
  const accs=[...new Set([...byAcc.keys(), ...Object.keys(ACC).filter(c=>isCash(c)&&level(c)>=3&&!children[c]&&Math.abs(close(S(st,c)))>0.004)])].sort(cmpCode);
  for(const c of accs){ const a=byAcc.get(c)||{i:0,o:0,ti:0,to:0}; const v=S(st,c); if(Math.abs(v.o)+v.d+v.c<0.004) continue; h+=`<tr><td class="name"><span class="code">${esc(c)}</span>${esc(name(c))}</td>${cell(v.o)}${cell(a.i)}${cell(a.o)}${cell(a.ti-a.to)}${cell(close(v))}</tr>`; }
  h+=`<tr class="total"><td>${t.totCash}</td>${cell(open)}${cell(tin)}${cell(tout)}${cell(trIn-trOut)}${cell(end)}</tr></tbody></table></div>`;
  h+=`<p class="note">${t.cfNote}</p>`;
  const gm=new Map();
  for(const [cash,ctr,m,i,o] of D.cf){ const j=ys.indexOf(m); if(j<0||isCash(ctr)) continue; const g=cfGroup(ctr); if(!gm.has(g)) gm.set(g, ys.map(()=>[0,0])); const arr=gm.get(g)[j]; arr[0]+=i; arr[1]+=o; }
  if(ys.length>1 && gm.size){
    let hm=`<div class="card mt"><h3>${t.cfTitle} · ${t.byMonth} · ${state.year}</h3><div class="cap">${t.netCol}, ₾</div><div class="tablewrap" style="box-shadow:none;border:0"><table class="ledger"><thead><tr><th>${t.flowCtr}</th>${YM.map(x=>`<th class="n" ${!x.real?'style="color:var(--faint)"':''}>${ymLabel(x)}</th>`).join('')}<th class="n">${t.total}</th></tr></thead><tbody>`;
    for(let gi=0; gi<CF_RULES.length; gi++){ if(!gm.has(gi)) continue; const arr=gm.get(gi); const rowTot=arr.reduce((s,[i,o])=>s+i-o,0);
      hm+=`<tr><td class="name">${esc(t.cfGroups[gi])}</td>${arr.map(([i,o])=>cell(i-o)).join('')}${cell(rowTot)}</tr>`; }
    const mtotals=ys.map((_,j)=>[...gm.values()].reduce((s,arr)=>s+arr[j][0]-arr[j][1],0));
    hm+=`<tr class="total"><td>${t.netFlow}</td>${mtotals.map(v=>cell(v)).join('')}${cell(mtotals.reduce((a,b)=>a+b,0))}</tr>`;
    hm+=`</tbody></table></div></div>`;
    h+=hm;
  }
  const el=document.getElementById('p-cf'); el.innerHTML=h;
  barChart(el.querySelector('#c-cf'),labels,[{name:t.inflow,color:cssVar('--accent'),vals:inV},{name:t.outflow,color:cssVar('--amber'),vals:outV}],null);
}

/* ---------- AR / AP ---------- */
const AR_LEDGERS=['1 4 10','3 1 20','3 1 10','3 1 31','3 1 32','4 1 90','3 2 10','1 4 30','1 4 50'];
function renderAR(){
  const t=T(); const P=period(); const st=stats(P.s,P.e); const led=state.arLedger; const isA=led[0]==='1'; const sign=isA?1:-1;
  let rows=(children[led]||[]).map(c=>{ const v=S(st,c); return {c,o:v.o*sign,d:v.d,k:v.c,e:close(v)*sign}; }).filter(r=>Math.abs(r.o)+r.d+r.k>0.004);
  const q=state.arQ.trim().toLowerCase(); if(q) rows=rows.filter(r=>name(r.c).toLowerCase().includes(q)||r.c.toLowerCase().includes(q));
  rows.sort((a,b)=>Math.abs(b.e)-Math.abs(a.e));
  const tot=rows.reduce((x,r)=>{x.o+=r.o;x.d+=r.d;x.k+=r.k;x.e+=r.e;return x;},{o:0,d:0,k:0,e:0});
  const nz=rows.filter(r=>Math.abs(r.e)>0.004).length; const opp=rows.filter(r=>r.e<-0.004);
  const top10=rows.slice(0,10).reduce((s,r)=>s+Math.max(r.e,0),0); const posTot=rows.reduce((s,r)=>s+Math.max(r.e,0),0);
  let h=periodHead(t.arTitle, `${t.asOf}: <b>${endOfLbl(P.e)}</b> · ${t.turnover}: ${P.label}`);
  h+=`<div class="toolbar"><div class="pills">${AR_LEDGERS.filter(l=>children[l]).map(l=>`<button data-led="${l}" aria-pressed="${l===led}"><span class="code" style="margin-right:5px">${l}</span>${t.arLedgers[l]}</button>`).join('')}</div></div>`;
  h+=`<div class="toolbar"><input type="search" id="arq" placeholder="${t.search}" value="${esc(state.arQ)}"><span style="color:var(--muted);font-size:12.5px">${rows.length} ${t.contragents}${q?' '+t.filtered:''}</span></div>`;
  h+=`<div class="kpis">${kpi(t.balEnd,tot.e,`${t.atStartLbl}: ${fmt(tot.o,0)} ₾`)}${kpi(t.toDr,tot.d)}${kpi(t.toCr,tot.k)}${kpi(t.nonZero,'<span class="num">'+nz+'</span>',`${t.top10}: ${posTot?(top10/posTot*100).toFixed(0):0}% ${t.ofBal}`)}${kpi(isA?t.oppA:t.oppL,'<span class="num">'+opp.length+'</span>',`${fmt(opp.reduce((s,r)=>s+r.e,0),0)} ₾`)}</div>`;
  const YM=yearMonths(state.year); const ys=YM.map(x=>x.idx); const trendLbl=YM.map(ymLabel);
  const trend = ys.length>1 ? ys.map(j=>close(S(stats(ys[0],j),led))*sign) : null;
  if(trend) h+=`<div class="card"><h3>${t.arLedgers[led]} · ${t.byMonth}</h3><div class="cap">${state.year}, ${t.eomBal}, ₾</div><div class="chart" id="c-artrend"></div></div>`;
  const mx=Math.max(...rows.map(r=>Math.abs(r.e)),1);
  h+=`<div class="tablewrap"><table class="ledger"><thead><tr><th>${t.code}</th><th>${t.contragent}</th><th class="n">${t.openBal}</th><th class="n">${t.debit}</th><th class="n">${t.credit}</th><th class="n">${t.closeBal}</th><th></th></tr></thead><tbody>`;
  const show=rows.slice(0,state.arN);
  for(const r of show) h+=`<tr><td class="code" style="margin:0">${esc(r.c.slice(led.length+1))}</td><td class="name">${esc(name(r.c))}</td>${cell(r.o)}${cell(r.d)}${cell(r.k)}${cell(r.e)}<td style="width:130px"><span class="bar" style="width:${(Math.abs(r.e)/mx*110).toFixed(0)}px;${r.e<0?'background:var(--neg)':''}"></span></td></tr>`;
  h+=`<tr class="total"><td colspan="2">${t.total} (${rows.length})</td>${cell(tot.o)}${cell(tot.d)}${cell(tot.k)}${cell(tot.e)}<td></td></tr></tbody></table>`;
  if(rows.length>state.arN) h+=`<div class="more"><button id="armore" style="color:var(--accent);font-weight:500">${t.showMore(Math.min(300,rows.length-state.arN),rows.length)}</button></div>`;
  h+=`</div><p class="note">${isA?t.arNoteA:t.arNoteL} ${t.negRed}</p>`;
  const el=document.getElementById('p-ar'); el.innerHTML=h;
  if(trend) lineChart(el.querySelector('#c-artrend'),trendLbl,[{name:t.balEnd,color:cssVar('--accent'),vals:trend}]);
  el.querySelectorAll('[data-led]').forEach(b=>b.addEventListener('click',()=>{ state.arLedger=b.dataset.led; state.arN=100; renderAR(); }));
  const inp=el.querySelector('#arq'); let tm; inp.addEventListener('input',()=>{ clearTimeout(tm); tm=setTimeout(()=>{ state.arQ=inp.value; state.arN=100; const pos=inp.selectionStart; renderAR(); const n=document.getElementById('arq'); n.focus(); n.setSelectionRange(pos,pos); },250); });
  const mb=el.querySelector('#armore'); if(mb) mb.addEventListener('click',()=>{ state.arN+=300; renderAR(); });
}

/* ---------- EXPENSES ---------- */
function renderEX(){
  const t=T(); const YM=yearMonths(state.year); const ys=YM.map(x=>x.idx); const realCount=YM.filter(x=>x.real).length||1;
  const ms=ys.map(i=>stats(i,i)); const yst=stats(ys[0],ys[ys.length-1]);
  const val=(s,c)=>{ const v=S(s,c); return v.d-v.c; };
  const roots=['7 4','7 3','7 1','8 2','9 2'];
  const keep=(k,s)=>Math.abs(val(yst,k))>0.004 || (S(yst,k).d+S(yst,k).c)>0.004;
  const row=(code,lv,has,open,id)=>{ const vals=ms.map(s=>val(s,code)); const mx=Math.max(...vals.map(Math.abs),0.01); const tot=val(yst,code); const l=lv<=1?'lvl1':lv===2?'lvl2':'';
    return `<tr class="${l}">${nameCell(code,lv,has,open,id)}${vals.map(v=>`<td class="n ${lv>=2?'heat':''}" style="--h:${(Math.abs(v)/mx).toFixed(2)}">${Math.abs(v)<0.005?'<span style="color:var(--faint)">·</span>':fmt(v,0)}</td>`).join('')}${cell(tot)}<td class="n">${fmt(tot/realCount,0)}</td></tr>`; };
  const opts={prefix:'ex',openTo:1,maxLevel:state.compactTabs.has('ex')?1:4,keep,row,sortVal:(k,s)=>val(yst,k)};
  const total=roots.reduce((s,c)=>s+val(yst,c),0); const rev=plLines(yst).rev;
  let h=periodHead(t.exTitle, `${t.year}: <b>${state.year}</b> · ${t.exSub}${state.month!==null?` · ${t.selMonth}: ${GMF()[+state.month-1]}`:''}`, compactBtn('ex'));
  h+=`<div class="kpis">${kpi(t.ga,val(yst,'7 4'),rev?`${(val(yst,'7 4')/rev*100).toFixed(1)}% ${t.ofRev}`:'')}${kpi(t.dist,val(yst,'7 3'))}${kpi(t.nonOpEx,val(yst,'8 2'))}${kpi(t.totEx,total,`${t.avgMonth} ${fmt(total/realCount,0)} ₾`)}</div>`;
  h+=`<div class="tablewrap"><table class="ledger"><thead><tr><th>${t.exItem}</th>${YM.map(x=>`<th class="n" ${(state.month!==null&&x.real&&x.mm===+state.month)?'style="color:var(--accent)"':(!x.real?'style="color:var(--faint)"':'')}>${ymLabel(x)}</th>`).join('')}<th class="n">${t.total} ${state.year}</th><th class="n">${t.avgCol}</th></tr></thead><tbody>`;
  h+=treeRows(roots,yst,opts);
  h+=`<tr class="total"><td>${t.total}</td>${ys.map((i,j)=>cell(roots.reduce((s,c)=>s+val(ms[j],c),0))).join('')}${cell(total)}<td class="n">${fmt(total/realCount,0)}</td></tr></tbody></table></div>`;
  h+=`<p class="note">${t.exNote}</p>`;
  document.getElementById('p-ex').innerHTML=h;
}

function diffCell(act,bud){
  if(act===undefined||isNaN(act)) return `<td class="n zero">–</td>`;
  const d=act-bud; const cls=['n']; if(Math.abs(d)<0.005) cls.push('zero'); else if(d<0) cls.push('neg');
  const pct=Math.abs(bud)>0.5 ? (d/Math.abs(bud)*100) : null;
  const pctTxt=pct===null?'':` <span style="font-size:10px;color:var(--muted)">(${pct>=0?'+':'−'}${Math.abs(pct).toFixed(1)}%)</span>`;
  return `<td class="${cls.join(' ')}">${fmt(d)}${pctTxt}</td>`;
}
function avRowTds(acts,buds,withYTD,ytdOk){
  if(ytdOk===undefined) ytdOk=true;
  let tds=''; for(let i=0;i<acts.length;i++) tds+=cell(acts[i])+cell(buds[i])+diffCell(acts[i],buds[i]);
  if(withYTD){
    if(ytdOk){ const ya=acts.reduce((s,v)=>s+v,0), yb=buds.reduce((s,v)=>s+v,0); tds+=cell(ya)+cell(yb)+diffCell(ya,yb); }
    else tds+='<td class="n zero">–</td><td class="n zero">–</td><td class="n zero">–</td>';

}
function avItemRow(b,actFn,withYTD,ytdOk,n){

/* Full P&L waterfall by Oris account, decomposed to exactly reconcile (no double count / no gap)
   with the dashboard's own already-verified plLines().net: revenue/cogs/opex use the narrow core
   accounts (6 1 10/6 1 20, 7 1+7 2, 7 3+7 4); every remaining class-6/class-8-1 sub-account not
   individually named by the budget gets folded into "Other Revenue" (87) as a catch-all, so nothing
   from class 6-9 is silently dropped. See avNotePL for what's approximate/unavailable and why. */
const PL_ACTUALS=(()=>{
  const incA=c=>j=>{ const v=S(stats(j,j),c); return v.c-v.d; };
  const expA=c=>j=>{ const v=S(stats(j,j),c); return v.d-v.c; };
  const sumA=(...fns)=>j=>fns.reduce((s,f)=>s+f(j),0);
  const rev79=sumA(incA('6 1 10'),incA('6 1 20'));
  const cogs81=sumA(expA('7 2'),expA('7 1'));
  const gross82=j=>rev79(j)-cogs81(j);
  const serv84=incA('6 1 91'), pen85=incA('8 1 25'), pbs86=incA('6 1 90 1');
  const oth87=sumA(incA('6 1 90 2'),incA('8 1 10'),incA('8 1 20'),incA('8 1 30'),incA('8 1 50'),incA('8 1 90'));
  const opex90=sumA(expA('7 3'),expA('7 4'));
  const ebitda105=j=>gross82(j)+serv84(j)+pen85(j)+pbs86(j)+oth87(j)-opex90(j);
  const nonop108=expA('8 2');
  const net118=j=>ebitda105(j)-nonop108(j)+incA('9 1')(j)-expA('9 2')(j);
  return {
    78:j=>rev79(j)*1.18, 79:rev79, 80:j=>cogs81(j)*1.18, 81:cogs81, 82:gross82,
    84:serv84, 85:pen85, 86:pbs86, 87:oth87, 90:opex90, 91:expA('7 3'),
    94:expA('7 4 90 49'), 95:sumA(expA('7 4 25'),expA('7 4 90 5')), 96:expA('7 4 20'),
    98:sumA(expA('7 4 22'),expA('7 4 90 32'),expA('7 4 90 34'),expA('7 4 90 42'),expA('7 4 90 48'),expA('7 4 90 52'),expA('7 4 45')),
    99:sumA(expA('7 4 90 11'),expA('7 4 90 27'),expA('7 4 90 28'),expA('7 4 90 50')),
    100:expA('7 4 90 39'), 104:expA('7 4 18'), 105:ebitda105, 108:nonop108, 118:net118,
  };
})();

/* Full Balance Sheet by Oris account, via the dashboard's own bsVal() so every row uses the exact
   same sign convention/closing-entry handling already verified (BS check = 0.00) elsewhere. Long-term
   loans (all lumped into Oris account 4 1 90 by contragent) are split into Bank/Zuk/Shareholder by
   the specific contragent sub-codes actually named that way in Oris - not a guess, verified against
   the budget's own Jan values (within 1-14%). See avNotePF-style disclosure in avNoteBS for gaps. */
const BS_ACTUALS=(()=>{
  const bv=(c,j)=>bsVal(stats(0,j),c);
  const sumBv=(...codes)=>j=>codes.reduce((s,c)=>s+bv(c,j),0);
  const BANK=['4 1 90 10611','4 1 90 3746','4 1 90 4693','4 1 90 5506','4 1 90 7426'];
  const ZUK=['4 1 90 8018'];
  const SH=['4 1 90 11677','4 1 90 11998','4 1 90 12284','4 1 90 1318','4 1 90 1684','4 1 90 2426','4 1 90 5959','4 1 90 8019'];
  return {
    124:j=>bsVal(stats(0,j),'1'), 125:j=>cashClose(stats(0,j)), 126:j=>bv('1 4 10',j), 128:j=>bv('1 6',j),
    129:j=>bsVal(stats(0,j),'2'), 130:j=>bv('2 1 60',j), 131:j=>bv('2 1 80',j), 132:j=>bv('2 1 90',j), 133:j=>bv('2 5',j),
    134:sumBv('2 2','2 6'), 135:j=>bsVal(stats(0,j),'1')+bsVal(stats(0,j),'2'),
    137:j=>bsVal(stats(0,j),'3'), 138:j=>bv('3 1 10',j), 139:j=>bv('3 1 20',j), 140:sumBv('3 1 30','3 1 32'),
    141:j=>bv('3 3 10',j), 142:j=>bv('3 3 20',j), 143:j=>bv('3 3 30',j), 144:j=>bv('3 3 40',j),
    146:j=>bv('3 3 80',j), 147:j=>bv('3 4 10',j), 148:j=>bsVal(stats(0,j),'4'),
    149:sumBv(...SH), 150:sumBv(...BANK), 151:sumBv(...ZUK),
    152:j=>bsVal(stats(0,j),'3')+bsVal(stats(0,j),'4'), 154:j=>bsVal(stats(0,j),'5'),
    155:j=>bv('5 3 10',j), 156:j=>bv('5 3 30',j), 157:j=>bsVal(stats(0,j),'3')+bsVal(stats(0,j),'4')+bsVal(stats(0,j),'5'),
  };
})();

/* Cash flow can only be split by counter-account, and Oris's cash ledger only ever settles against
   ~20 broad counter accounts (most G&A bills route through the supplier-payable account 3 1 10, not
   their own expense account, before being paid) - so most budget CF line items simply have no
   isolable actual at this granularity. Only customer/advance collections and long-term-loan
   draws/repayments are cleanly attributable; everything else is dash, disclosed in avNoteCF. */
const CF_ACTUALS=(()=>{
  const byCtr={};
  for(const [,ctr,m,i,o] of D.cf){ if(isCash(ctr)) continue;
    const e=(byCtr[ctr]||(byCtr[ctr]={}))[m]||((byCtr[ctr][m])={i:0,o:0}); e.i+=i; e.o+=o; }
  const cIn=c=>j=>(byCtr[c]&&byCtr[c][j]?byCtr[c][j].i:0), cOut=c=>j=>(byCtr[c]&&byCtr[c][j]?byCtr[c][j].o:0);
  const finIn=cIn('4 1 90'), finOut=cOut('4 1 90');
  const cashAt=j=>cashClose(stats(0,j)); const openingCash=S(stats(0,0),'1 1').o+S(stats(0,0),'1 2').o;
  const startAt=j=>j===0?openingCash:cashAt(j-1);
  return {
    28:cIn('1 4 10'), 29:cIn('3 1 20'), 61:j=>finIn(j)-finOut(j), 62:finIn, 67:finOut, 71:finOut,
    72:j=>cashAt(j)-startAt(j), 73:startAt, 74:cashAt,
  };
})();

function syncTopScroll(){
  const panel=document.querySelector('.panel.on'); if(!panel) return;
  panel.querySelectorAll('.tablewrap').forEach(wrap=>{
    const w=wrap.querySelector('table')?.scrollWidth||wrap.scrollWidth;
    if(w<=wrap.clientWidth+1) return;
    const mirror=document.createElement('div'); mirror.className='top-scroll';
    const inner=document.createElement('div'); inner.style.width=w+'px'; mirror.appendChild(inner);
    wrap.parentNode.insertBefore(mirror, wrap);
    mirror.addEventListener('scroll',()=>{ wrap.scrollLeft=mirror.scrollLeft; });
    wrap.addEventListener('scroll',()=>{ mirror.scrollLeft=wrap.scrollLeft; });
  });
